<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RankSport Commercial MVP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0B0F1A; --card: #161B2D; --primary: #C5A059; }
        body { background: var(--bg); color: #F1F5F9; font-family: 'Inter', sans-serif; }
        .cyber-card { background: var(--card); border: 1px solid rgba(197, 160, 89, 0.1); border-radius: 20px; }
        .rank-gradient { background: linear-gradient(90deg, #C5A059 0%, #FDE68A 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn-google { background: white; color: #1f2937; font-weight: 700; padding: 14px; border-radius: 12px; display: flex; items-center; justify-content: center; gap: 10px; width: 100%; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="auth-screen" class="min-h-screen flex flex-col justify-center px-8">
        <div class="text-center mb-10">
            <h1 style="font-family:'Orbitron'" class="text-4xl rank-gradient mb-2 italic">RANK SPORT</h1>
            <p class="text-slate-500 text-[10px] uppercase tracking-widest font-bold">Hệ thống xếp hạng VĐV chuyên nghiệp</p>
        </div>
        <button id="login-google" class="btn-google">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20">
            Đăng nhập bằng Google
        </button>
        <p class="text-slate-600 text-[10px] text-center mt-6 italic">Miễn phí trọn đời cho vận động viên hội viên</p>
    </div>

    <div id="main-app" class="hidden pb-24">
        <header class="p-6 border-b border-white/5 sticky top-0 bg-[#0B0F1A]/80 backdrop-blur-md z-10">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <img id="user-avatar" src="" class="w-12 h-12 rounded-full border-2 border-[#C5A059]">
                    <div>
                        <h2 id="user-name" class="font-bold text-lg leading-none">VĐV Tên</h2>
                        <span id="user-rank" class="rank-gradient text-[10px] font-black italic uppercase">Rank Name</span>
                    </div>
                </div>
                <div class="text-right">
                    <p id="user-elo" class="text-2xl font-black text-[#C5A059] italic">----</p>
                    <p class="text-[9px] text-slate-500 uppercase font-bold tracking-tighter">Elo Rating</p>
                </div>
            </div>
        </header>

        <nav class="flex px-6 py-4 gap-4 overflow-x-auto no-scrollbar">
            <button onclick="switchTab('ranking')" class="px-4 py-2 rounded-full bg-[#C5A059] text-black text-xs font-bold whitespace-nowrap">Bảng Xếp Hạng</button>
            <button onclick="switchTab('courts')" class="px-4 py-2 rounded-full bg-white/5 text-slate-400 text-xs font-bold whitespace-nowrap">Sân Chơi</button>
            <button onclick="switchTab('history')" class="px-4 py-2 rounded-full bg-white/5 text-slate-400 text-xs font-bold whitespace-nowrap">Lịch Sử</button>
        </nav>

        <div id="tab-ranking" class="px-6 space-y-3">
            <h3 class="text-xs font-bold text-slate-500 uppercase mb-4 tracking-widest">Top Vận Động Viên</h3>
            <div id="ranking-list" class="space-y-2">
                </div>
        </div>

        <div id="tab-courts" class="hidden px-6 space-y-4">
            <h3 class="text-xs font-bold text-slate-500 uppercase mb-4 tracking-widest">Sân Đấu Kích Hoạt</h3>
            <div id="court-list" class="space-y-4">
                </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBpytj0KQybf55iabBzmeg59VL-9oADPHA",
            authDomain: "badrank-89mrd.firebaseapp.com",
            projectId: "badrank-89mrd",
            storageBucket: "badrank-89mrd.firebasestorage.app",
            messagingSenderId: "94437268200",
            appId: "1:94437268200:web:b1726f5d55cc5e631c475d"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // Dữ liệu giả lập để test
        const mockVdv = [
            { name: "Nguyễn Văn A", elo: 1450, rank: "PLATINUM I" },
            { name: "Trần Thị B", elo: 1320, rank: "GOLD II" },
            { name: "Lê Văn C", elo: 1280, rank: "GOLD III" }
        ];

        const mockCourts = [
            { name: "Sân Cầu Lông Kỳ Hòa", address: "Quận 10, TP.HCM", status: "Active" },
            { name: "Sân Đào Duy Anh", address: "Phú Nhuận, TP.HCM", status: "Full" }
        ];

        // Xử lý đăng nhập
        document.getElementById('login-google').onclick = async () => {
            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;
                setupRealtime(user);
                showMainApp(user);
                renderMockData();
            } catch (error) {
                alert("Lỗi đăng nhập: " + error.message);
            }
        };

        function showMainApp(user) {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            document.getElementById('user-name').innerText = user.displayName;
            document.getElementById('user-avatar').src = user.photoURL;
        }

        function renderMockData() {
            // Render VĐV
            const rankList = document.getElementById('ranking-list');
            rankList.innerHTML = mockVdv.map((v, i) => `
                <div class="cyber-card p-4 flex justify-between items-center">
                    <div class="flex items-center gap-3">
                        <span class="text-slate-600 font-black">#${i+1}</span>
                        <div>
                            <p class="font-bold text-sm">${v.name}</p>
                            <p class="text-[9px] text-[#C5A059] font-bold tracking-tighter">${v.rank}</p>
                        </div>
                    </div>
                    <p class="font-black italic text-[#C5A059]">${v.elo}</p>
                </div>
            `).join('');

            // Render Sân
            const courtList = document.getElementById('court-list');
            courtList.innerHTML = mockCourts.map(c => `
                <div class="cyber-card p-5">
                    <div class="flex justify-between items-start mb-2">
                        <h4 class="font-bold text-[#C5A059]">${c.name}</h4>
                        <span class="text-[9px] px-2 py-1 bg-green-500/20 text-green-400 rounded-full font-bold uppercase">${c.status}</span>
                    </div>
                    <p class="text-[11px] text-slate-400">📍 ${c.address}</p>
                </div>
            `).join('');
        }

        function setupRealtime(user) {
            onSnapshot(doc(db, "users", user.uid), (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('user-elo').innerText = data.elo;
                    document.getElementById('user-rank').innerText = data.rank;
                }
            });
        }

        window.switchTab = (tab) => {
            document.getElementById('tab-ranking').classList.toggle('hidden', tab !== 'ranking');
            document.getElementById('tab-courts').classList.toggle('hidden', tab !== 'courts');
        };
    </script>
</body>
</html>
