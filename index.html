<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RankSport MVP V27.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg: #050505; --card: #121212; --primary: #FACC15; --text-dim: #888888; }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .liftoff-card { background: var(--card); border-radius: 24px; padding: 20px; border: 1px solid rgba(255,255,255,0.03); margin-bottom: 12px; }
        .nav-bar { background: rgba(5, 5, 5, 0.9); backdrop-filter: blur(20px); border-top: 1px solid #151515; height: 85px; position: fixed; bottom: 0; left: 0; right: 0; display: flex; justify-content: space-around; align-items: center; z-index: 50; }
        .nav-btn { color: var(--text-dim); display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 9px; font-weight: 800; border: none; background: none; cursor: pointer; }
        .nav-btn.active { color: var(--primary); }
        .action-btn { width: 56px; height: 56px; background: var(--primary); border-radius: 20px; display: flex; align-items: center; justify-content: center; color: black; font-size: 24px; margin-top: -45px; box-shadow: 0 10px 25px rgba(250, 204, 21, 0.3); }
        .slot { padding: 12px; border-radius: 14px; font-size: 11px; font-weight: 800; text-align: center; border: 1px solid #222; cursor: pointer; transition: 0.2s; }
        .slot.available { border-color: var(--primary); color: var(--primary); }
        .slot.pending { background: #f59e0b; color: black; border-color: #f59e0b; animation: pulse 1.5s infinite; }
        .slot.booked { opacity: 0.15; background: #222; cursor: not-allowed; border: none; }
        .hidden { display: none !important; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <div id="auth-screen" class="min-h-screen flex flex-col justify-center items-center px-10 text-center">
        <div class="w-20 h-20 bg-primary rounded-[2rem] flex items-center justify-center rotate-12 mb-8 shadow-2xl">
            <i class="fa-solid fa-bolt-lightning text-4xl text-black -rotate-12"></i>
        </div>
        <h1 class="text-3xl font-black italic mb-2 tracking-tight">RANKSPORT <span class="text-primary">EMPIRE</span></h1>
        <p class="text-dim text-[10px] font-bold uppercase tracking-[0.3em] mb-12">No-Storage Test Mode</p>
        <button id="login-google" class="w-full bg-white text-black font-black py-4 rounded-2xl flex items-center justify-center gap-3 active:scale-95 transition">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20"> Tiếp tục với Google
        </button>
    </div>

    <div id="onboarding-screen" class="hidden fixed inset-0 bg-black z-[100] p-8 flex flex-col justify-center">
        <h2 class="text-2xl font-black mb-6 uppercase italic">Vai trò của bạn?</h2>
        <div class="space-y-4">
            <button onclick="setRole('vdv')" class="w-full liftoff-card text-left border-2 border-transparent hover:border-primary transition">
                <p class="font-black text-lg">VẬN ĐỘNG VIÊN</p>
                <p class="text-[10px] text-dim font-bold uppercase">Leo Rank & Đặt sân nhanh</p>
            </button>
            <button onclick="setRole('owner')" class="w-full liftoff-card text-left border-2 border-transparent hover:border-blue-500 transition">
                <p class="font-black text-lg text-blue-400">CHỦ SÂN</p>
                <p class="text-[10px] text-dim font-bold uppercase">Quản lý lịch & Duyệt đơn</p>
            </button>
        </div>
    </div>

    <div id="main-app" class="hidden pb-24">
        <header class="p-8 flex justify-between items-center sticky top-0 bg-black/80 backdrop-blur-md z-40">
            <div><h2 id="user-name" class="text-xl font-black italic tracking-tight">---</h2><p id="user-role" class="text-[9px] font-black text-primary uppercase mt-1">---</p></div>
            <img id="user-img" src="" class="w-11 h-11 rounded-2xl border-2 border-white/5">
        </header>

        <div id="tab-booking" class="tab-content px-6">
            <div class="liftoff-card">
                <div class="flex justify-between items-start mb-6">
                    <div><h4 class="font-black text-lg">Sân Empire (Test)</h4><p class="text-[9px] text-dim italic">Bấm vào giờ để đặt</p></div>
                    <span class="text-primary font-black italic text-lg">80k<span class="text-[10px]">/h</span></span>
                </div>
                <div class="grid grid-cols-3 gap-3" id="slot-container"></div>
            </div>
        </div>

        <div id="tab-ranking" class="tab-content hidden px-6">
            <h3 class="text-[11px] font-black text-dim uppercase mb-6">BXH THẾ GIỚI</h3>
            <div id="ranking-list" class="space-y-2"></div>
        </div>

        <div id="tab-manage" class="tab-content hidden px-6">
            <h3 class="text-[11px] font-black text-dim uppercase mb-6">Đơn chờ duyệt</h3>
            <div id="order-list" class="space-y-4"></div>
        </div>

        <nav class="nav-bar">
            <button onclick="showTab('booking')" id="btn-booking" class="nav-btn active"><i class="fa-solid fa-calendar-days text-lg"></i><span>BOOKING</span></button>
            <button onclick="showTab('ranking')" id="btn-ranking" class="nav-btn"><i class="fa-solid fa-ranking-star text-lg"></i><span>RANK</span></button>
            <div class="action-btn" onclick="alert('Admin: trandung.tv.89@gmail.com')"><i class="fa-solid fa-plus"></i></div>
            <button onclick="showTab('manage')" id="btn-manage" class="nav-btn hidden"><i class="fa-solid fa-list-check text-lg"></i><span>QUẢN LÝ</span></button>
        </nav>
    </div>

    <div id="payment-modal" class="hidden fixed inset-0 bg-black/95 z-[200] p-6 flex items-center justify-center">
        <div class="w-full max-w-sm bg-card rounded-[2.5rem] p-8 border border-white/10 text-center">
            <p class="text-[10px] font-black text-primary uppercase tracking-[0.3em] mb-4">Xác nhận chuyển khoản</p>
            <div class="bg-white p-3 rounded-2xl inline-block mb-4">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=0912345678" class="w-32 h-32">
            </div>
            <p class="text-sm font-bold text-white/70 mb-6 px-4 italic">Quét mã và chuyển 80k. Hệ thống sẽ báo chủ sân kiểm tra ngay.</p>
            <button id="confirm-pay-btn" class="w-full bg-primary text-black font-black py-4 rounded-2xl shadow-lg active:scale-95 transition">XÁC NHẬN ĐÃ CHUYỂN TIỀN</button>
            <button onclick="document.getElementById('payment-modal').classList.add('hidden')" class="mt-4 text-[10px] text-dim font-bold uppercase tracking-widest">Hủy bỏ</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, onSnapshot, collection, query, orderBy, updateDoc, addDoc } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBpytj0KQybf55iabBzmeg59VL-9oADPHA",
            authDomain: "badrank-89mrd.firebaseapp.com",
            projectId: "badrank-89mrd",
            storageBucket: "badrank-89mrd.firebasestorage.app"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();
        
        // --- SỬA EMAIL CỦA ÔNG TẠI ĐÂY ---
        const ADMIN_EMAIL = "trandung.tv.89@gmail.com"; 

        let selectedTime = null;

        document.getElementById('login-google').onclick = async () => {
            const res = await signInWithPopup(auth, provider);
            const userDoc = await getDoc(doc(db, "users", res.user.uid));
            if (!userDoc.exists()) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('onboarding-screen').classList.remove('hidden');
            } else { launchApp(res.user, userDoc.data()); }
        };

        window.setRole = async (role) => {
            const user = auth.currentUser;
            const data = { uid: user.uid, displayName: user.displayName, photoURL: user.photoURL, email: user.email, role, elo: 1200, rank: "BRONZE I", createdAt: new Date() };
            await setDoc(doc(db, "users", user.uid), data);
            launchApp(user, data);
        };

        function launchApp(user, data) {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('onboarding-screen').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            document.getElementById('user-name').innerText = user.displayName;
            document.getElementById('user-img').src = user.photoURL;
            document.getElementById('user-role').innerText = data.role === 'owner' || user.email === ADMIN_EMAIL ? 'Quản lý Hệ Thống' : 'Vận Động Viên';
            
            if (data.role === 'owner' || user.email === ADMIN_EMAIL) {
                document.getElementById('btn-manage').classList.remove('hidden');
            }

            initRealtime();
        }

        function initRealtime() {
            // BXH
            onSnapshot(query(collection(db, "users"), orderBy("elo", "desc")), (snap) => {
                const list = document.getElementById('ranking-list');
                list.innerHTML = "";
                snap.forEach((d, i) => {
                    const u = d.data();
                    list.innerHTML += `<div class="liftoff-card flex justify-between items-center py-3">
                        <div class="flex items-center gap-3">
                            <span class="text-[10px] font-black ${i<3?'text-primary':'text-dim'}">#${i+1}</span>
                            <img src="${u.photoURL}" class="w-10 h-10 rounded-xl">
                            <div><p class="font-bold text-xs">${u.displayName}</p><p class="text-[7px] text-primary uppercase">${u.rank}</p></div>
                        </div>
                        <p class="font-black italic">${u.elo}</p>
                    </div>`;
                });
            });

            // Lịch sân
            const times = ["17:00", "18:00", "19:00", "20:00", "21:00", "22:00"];
            onSnapshot(collection(db, "bookings"), (snap) => {
                const container = document.getElementById('slot-container');
                container.innerHTML = "";
                const bookedMap = {};
                snap.forEach(d => bookedMap[d.data().time] = d.data().status);
                times.forEach(t => {
                    let cls = "available";
                    if(bookedMap[t] === 'pending') cls = "pending";
                    if(bookedMap[t] === 'confirmed') cls = "booked";
                    container.innerHTML += `<div onclick="handleSlot('${t}', '${bookedMap[t]}')" class="slot ${cls}">${t}</div>`;
                });
            });

            // Duyệt đơn
            onSnapshot(collection(db, "bookings"), (snap) => {
                const list = document.getElementById('order-list');
                list.innerHTML = "";
                snap.forEach(d => {
                    const o = d.data();
                    if(o.status === 'pending') {
                        list.innerHTML += `<div class="liftoff-card">
                            <p class="text-[10px] font-black text-primary mb-2 uppercase">Yêu cầu lúc: ${o.time}</p>
                            <p class="text-sm font-bold mb-4">Khách: ${o.userName}</p>
                            <button onclick="confirmOrder('${d.id}')" class="w-full bg-white text-black font-black py-3 rounded-xl text-[10px]">XÁC NHẬN TIỀN ĐÃ VỀ</button>
                        </div>`;
                    }
                });
            });
        }

        window.handleSlot = (time, status) => {
            if(status) return;
            selectedTime = time;
            document.getElementById('payment-modal').classList.remove('hidden');
        };

        document.getElementById('confirm-pay-btn').onclick = async () => {
            await addDoc(collection(db, "bookings"), {
                time: selectedTime,
                userName: auth.currentUser.displayName,
                status: 'pending',
                createdAt: new Date()
            });
            document.getElementById('payment-modal').classList.add('hidden');
            alert("Thông báo đã gửi tới chủ sân!");
        };

        window.confirmOrder = async (id) => {
            await updateDoc(doc(db, "bookings", id), { status: 'confirmed' });
        };

        window.showTab = (tab) => {
            document.querySelectorAll('.tab-content').forEach(e => e.classList.add('hidden'));
            document.querySelectorAll('.nav-btn').forEach(e => e.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            document.getElementById(`btn-${tab}`).classList.add('active');
        };

        onAuthStateChanged(auth, (user) => { if (user) checkUser(user); });
        async function checkUser(user) {
            const d = await getDoc(doc(db, "users", user.uid));
            if (d.exists()) launchApp(user, d.data());
        }
    </script>
</body>
</html>
