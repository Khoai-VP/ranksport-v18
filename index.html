<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RankSport MVP V27.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <style>
        .slot-booked { background-color: #94a3b8 !important; cursor: not-allowed; }
        .slot-pending { background-color: #fbbf24 !important; }
        .slot-available { background-color: #10b981; cursor: pointer; }
        .loading-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 9999; }
    </style>
</head>
<body class="bg-gray-100 pb-20">

    <div id="loading" class="loading-overlay"><div class="animate-spin rounded-full h-12 w-12 border-b-2 border-white"></div></div>

    <div id="auth-section" class="flex flex-col items-center justify-center min-h-screen p-4">
        <h1 class="text-3xl font-bold mb-8 text-blue-600">RankSport MVP</h1>
        <button id="login-btn" class="bg-white border border-gray-300 px-6 py-3 rounded-lg shadow-sm flex items-center hover:bg-gray-50">
            <img src="https://www.gstatic.com/images/branding/product/1x/gmail_512dp.png" class="w-6 h-6 mr-2" alt="G">
            Đăng nhập bằng Google
        </button>
    </div>

    <div id="main-ui" class="hidden">
        <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-10">
            <div class="flex justify-between items-center">
                <span id="user-info" class="font-medium">Chào mừng!</span>
                <button id="logout-btn" class="text-sm bg-blue-700 px-3 py-1 rounded">Thoát</button>
            </div>
        </header>

        <div id="role-selector" class="hidden p-4">
            <h2 class="text-xl font-bold mb-4 text-center">Bạn là ai?</h2>
            <div class="grid grid-cols-2 gap-4">
                <button onclick="setRole('player')" class="bg-green-500 text-white p-6 rounded-xl shadow-lg">VẬN ĐỘNG VIÊN</button>
                <button onclick="setRole('owner')" class="bg-blue-500 text-white p-6 rounded-xl shadow-lg">CHỦ SÂN</button>
            </div>
        </div>

        <main id="app-content" class="p-4"></main>

        <nav class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around p-2 shadow-lg">
            <button onclick="showBooking()" class="flex flex-col items-center p-2 text-blue-600">
                <span class="text-xs">BOOKING</span>
            </button>
            <button id="nav-admin" onclick="showAdmin()" class="hidden flex flex-col items-center p-2 text-gray-600">
                <span class="text-xs font-bold text-red-500">QUẢN LÝ</span>
            </button>
        </nav>
    </div>

    <div id="booking-modal" class="hidden fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl p-6 w-full max-w-md text-center">
            <h3 class="text-xl font-bold mb-4">THANH TOÁN GIỮ SÂN</h3>
            <div class="bg-gray-100 p-4 rounded-lg mb-4">
                <p id="modal-slot-info" class="font-bold text-lg mb-2"></p>
                <p class="text-red-500 font-bold text-2xl mb-4">50.000đ</p>
                <img id="qr-code" src="https://img.vietqr.io/image/mbbank-0358655999-compact2.png?amount=50000&addInfo=DATSAN" class="mx-auto w-48 h-48 border-2 border-blue-500 p-1">
            </div>
            <p class="text-sm text-gray-500 mb-4 italic">Nội dung CK: DATSAN [Họ tên]</p>
            <div class="flex gap-2">
                <button onclick="closeModal()" class="flex-1 py-3 border rounded-xl">Hủy</button>
                <button onclick="confirmBooking()" class="flex-1 py-3 bg-yellow-500 text-white font-bold rounded-xl">XÁC NHẬN ĐÃ CHUYỂN</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. CONFIGURATION ---
        const ADMIN_EMAIL = "trandung.tv.89@gmail.com";
        const firebaseConfig = {
            apiKey: "AIzaSyBpytj0KQybf55iabBzmeg59VL-9oADPHA",
            authDomain: "badrank-89mrd.firebaseapp.com",
            projectId: "badrank-89mrd",
            storageBucket: "badrank-89mrd.appspot.com",
            messagingSenderId: "951939105470",
            appId: "1:951939105470:web:968f94f61f94d9b4b08705"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const provider = new firebase.auth.GoogleAuthProvider();

        let currentUser = null;
        let userData = null;
        let selectedSlot = null;

        // --- 2. AUTHENTICATION ---
        document.getElementById('login-btn').onclick = () => auth.signInWithPopup(provider);
        document.getElementById('logout-btn').onclick = () => auth.signOut();

        auth.onAuthStateChanged(async (user) => {
            currentUser = user;
            if (user) {
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('main-ui').classList.remove('hidden');
                document.getElementById('user-info').innerText = user.displayName;
                
                // Check user record
                const userDoc = await db.collection('users').doc(user.uid).get();
                if (!userDoc.exists) {
                    document.getElementById('role-selector').classList.remove('hidden');
                    document.getElementById('app-content').innerHTML = '';
                } else {
                    userData = userDoc.data();
                    if (userData.email === ADMIN_EMAIL || userData.role === 'owner') {
                        document.getElementById('nav-admin').classList.remove('hidden');
                    }
                    showBooking();
                }
            } else {
                location.reload();
            }
        });

        async function setRole(role) {
            if (!currentUser) return;
            showLoading(true);
            userData = {
                uid: currentUser.uid,
                displayName: currentUser.displayName,
                email: currentUser.email,
                role: role,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            };
            await db.collection('users').doc(currentUser.uid).set(userData);
            document.getElementById('role-selector').classList.add('hidden');
            if (role === 'owner' || currentUser.email === ADMIN_EMAIL) {
                document.getElementById('nav-admin').classList.remove('hidden');
            }
            showLoading(false);
            showBooking();
        }

        // --- 3. BOOKING LOGIC ---
        function showBooking() {
            const app = document.getElementById('app-content');
            app.innerHTML = `
                <h2 class="text-xl font-bold mb-4">LỊCH SÂN HÔM NAY</h2>
                <div id="slots-grid" class="grid grid-cols-2 gap-3"></div>
            `;
            
            // Listen for changes
            db.collection('bookings').onSnapshot(snapshot => {
                const booked = {};
                snapshot.forEach(doc => { booked[doc.id] = doc.data(); });
                renderSlots(booked);
            });
        }

        function renderSlots(booked) {
            const grid = document.getElementById('slots-grid');
            if (!grid) return;
            grid.innerHTML = '';
            const hours = ["05:00","06:00","07:00","08:00","17:00","18:00","19:00","20:00","21:00","22:00"];
            
            hours.forEach(h => {
                const status = booked[h] ? (booked[h].status === 'confirmed' ? 'booked' : 'pending') : 'available';
                const btn = document.createElement('div');
                btn.className = `p-4 rounded-xl text-center text-white font-bold transition-all shadow-sm ${
                    status === 'booked' ? 'slot-booked' : (status === 'pending' ? 'slot-pending' : 'slot-available')
                }`;
                btn.innerHTML = `${h}<br><span class="text-xs">${status === 'booked' ? 'ĐÃ ĐẶT' : (status === 'pending' ? 'CHỜ DUYỆT' : 'TRỐNG')}</span>`;
                
                if (status === 'available') {
                    btn.onclick = () => openBookingModal(h);
                }
                grid.appendChild(btn);
            });
        }

        function openBookingModal(h) {
            selectedSlot = h;
            document.getElementById('modal-slot-info').innerText = "Giờ đặt: " + h;
            document.getElementById('booking-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('booking-modal').classList.add('hidden');
        }

        async function confirmBooking() {
            if (!selectedSlot || !currentUser) return;
            showLoading(true);
            try {
                await db.collection('bookings').doc(selectedSlot).set({
                    user: currentUser.displayName,
                    uid: currentUser.uid,
                    time: selectedSlot,
                    status: 'pending',
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                closeModal();
                alert("Đã gửi đơn! Chờ Admin duyệt trong 30s.");
            } catch (e) {
                alert("Lỗi: " + e.message);
            }
            showLoading(false);
        }

        // --- 4. ADMIN LOGIC ---
        function showAdmin() {
            const app = document.getElementById('app-content');
            app.innerHTML = `<h2 class="text-xl font-bold mb-4 text-red-600">QUẢN LÝ ĐƠN ĐẶT</h2><div id="admin-list" class="space-y-4"></div>`;
            
            db.collection('bookings').where('status', '==', 'pending').onSnapshot(snapshot => {
                const list = document.getElementById('admin-list');
                if (!list) return;
                list.innerHTML = snapshot.empty ? '<p class="text-gray-500">Chưa có đơn nào cần duyệt.</p>' : '';
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const item = document.createElement('div');
                    item.className = "bg-white p-4 rounded-xl shadow border-l-4 border-yellow-500 flex justify-between items-center";
                    item.innerHTML = `
                        <div>
                            <p class="font-bold">${data.time}</p>
                            <p class="text-sm text-gray-600">${data.user}</p>
                        </div>
                        <button onclick="approveBooking('${doc.id}')" class="bg-green-500 text-white px-4 py-2 rounded-lg text-sm">DUYỆT</button>
                    `;
                    list.appendChild(item);
                });
            });
        }

        async function approveBooking(id) {
            showLoading(true);
            await db.collection('bookings').doc(id).update({ status: 'confirmed' });
            showLoading(false);
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'flex' : 'none';
        }
    </script>
</body>
</html>
