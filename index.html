<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>RankSport Pro - Quản Lý Sân Hybrid</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Oswald:wght@700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; margin: 0; }
        .sport-font { font-family: 'Oswald', sans-serif; text-transform: uppercase; }
        .grid-container { display: grid; grid-template-columns: 75px repeat(var(--num-courts, 1), minmax(110px, 1fr)); border: 1px solid #e2e8f0; background: white; }
        .grid-cell { border: 0.5px solid #f1f5f9; height: 45px; display: flex; align-items: center; justify-content: center; font-size: 10px; cursor: pointer; transition: all 0.2s; }
        .cell-time { background: #f8fafc; font-weight: bold; border-right: 2px solid #e2e8f0; position: sticky; left: 0; z-index: 10; font-size: 9px; }
        .header-cell { background: #1e293b; color: white; position: sticky; top: 0; z-index: 20; font-family: 'Oswald'; }
        .status-empty { color: #cbd5e1; }
        .status-manual-locked { background: #1e293b !important; color: #fbbf24 !important; font-weight: 800; border: 1px solid #fbbf24; }
        .status-booked { background: #ef4444 !important; color: white !important; font-weight: bold; }
        .is-selecting { background: #dbeafe; border: 2px solid #2563eb !important; z-index: 5; }
        .card { background: white; border-radius: 16px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-32">

    <div id="loading" class="hidden fixed inset-0 bg-white/80 flex flex-col items-center justify-center z-[100]">
        <div class="animate-spin rounded-full h-10 w-10 border-t-2 border-blue-600"></div>
        <p class="text-[10px] font-bold mt-2 text-blue-600 uppercase">Đang xử lý dữ liệu...</p>
    </div>

    <header class="bg-white border-b p-4 sticky top-0 z-40 flex justify-between items-center">
        <span class="sport-font text-2xl text-blue-600 italic font-black">RANK<span class="text-slate-900">S</span></span>
        <div id="user-info" class="text-[9px] font-bold text-slate-400 border px-3 py-1 rounded-full bg-slate-50 uppercase">Đang tải...</div>
    </header>

    <main id="main-content" class="p-4 max-w-5xl mx-auto space-y-6"></main>

    <div id="lock-panel" class="hidden fixed bottom-24 left-4 right-4 bg-slate-900 shadow-2xl rounded-2xl p-4 flex justify-between items-center z-[100] border border-white/10">
        <div class="flex flex-col">
            <span id="txt-duration" class="text-white font-black leading-none text-sm">0 GIỜ</span>
            <span id="txt-money" class="text-blue-400 text-[10px] font-bold">0 VNĐ</span>
        </div>
        <div class="flex gap-2">
            <button onclick="actionLock('locked')" class="bg-amber-400 text-slate-900 px-5 py-2.5 rounded-xl text-[10px] font-black uppercase">KHÓA SÂN</button>
            <button onclick="actionLock('empty')" class="bg-white/10 text-white px-5 py-2.5 rounded-xl text-[10px] font-black uppercase">MỞ TRỐNG</button>
        </div>
    </div>

    <nav class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t flex justify-around p-3 z-50 shadow-2xl">
        <button onclick="renderManagement()" class="flex flex-col items-center gap-1 text-[10px] font-bold text-slate-400 hover:text-blue-600"><span>⚙️</span>CẤU HÌNH</button>
        <button onclick="renderBookingGrid()" class="flex flex-col items-center gap-1 text-[10px] font-bold text-slate-400 hover:text-blue-600"><span>📅</span>LỊCH ĐẶT</button>
    </nav>

    <script>
        // Cấu hình Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBpytj0KQybf55iabBzmeg59VL-9oADPHA",
            authDomain: "badrank-89mrd.firebaseapp.com",
            projectId: "badrank-89mrd",
            storageBucket: "badrank-89mrd.appspot.com",
            messagingSenderId: "951939105470",
            appId: "1:951939105470:web:968f94f61f94d9b4b08705"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        auth.onAuthStateChanged(user => { 
            if (user) {
                document.getElementById('user-info').innerText = user.displayName;
                renderManagement(); 
            } else { renderLogin(); }
        });

        function showLoading(s) { document.getElementById('loading').classList.toggle('hidden', !s); }

        function renderLogin() {
            document.getElementById('main-content').innerHTML = `
                <div class="h-[60vh] flex items-center justify-center">
                    <button onclick="auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())" class="bg-blue-600 text-white px-8 py-4 rounded-2xl font-black sport-font shadow-xl hover:bg-blue-700">ĐĂNG NHẬP CHỦ SÂN</button>
                </div>`;
        }

        // --- TAB 1: CẤU HÌNH ---
        async function renderManagement() {
            showLoading(true);
            const doc = await db.collection("courts").doc(auth.currentUser.uid).get();
            const d = doc.exists ? doc.data() : { ten: "", dc: "", qr: "", ds: [], dv: [] };
            showLoading(false);

            document.getElementById("main-content").innerHTML = `
                <div class="card p-6 space-y-6">
                    <div class="space-y-4">
                        <h2 class="sport-font text-blue-600 text-lg">Thông tin cơ sở</h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <input id="m-ten" value="${d.ten}" class="p-4 border rounded-2xl text-sm bg-slate-50 outline-none focus:ring-2 focus:ring-blue-500" placeholder="Tên cụm sân">
                            <input id="m-dc" value="${d.dc}" class="p-4 border rounded-2xl text-sm bg-slate-50 outline-none focus:ring-2 focus:ring-blue-500" placeholder="Địa chỉ">
                        </div>
                    </div>

                    <div class="bg-blue-50 p-4 rounded-2xl border border-blue-100 flex flex-wrap gap-3">
                        <select id="m-type" class="flex-1 min-w-[120px] p-3 rounded-xl border text-sm font-bold"><option>Pickleball</option><option>Cầu lông</option><option>Bóng đá</option></select>
                        <input id="m-count" type="number" class="w-24 p-3 border rounded-xl text-sm" placeholder="SL Sân">
                        <button onclick="appendCourts()" class="bg-blue-600 text-white px-6 rounded-xl text-xs font-black shadow-lg">THÊM NHANH</button>
                    </div>

                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase">QR Thanh toán (Momo/Bank)</label>
                        <input type="file" onchange="previewQR(this)" class="mt-2 block w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-blue-50 file:text-blue-700">
                        <img id="m-qr-img" src="${d.qr || ''}" class="w-32 h-32 mt-3 rounded-lg border shadow-sm ${d.qr ? '' : 'hidden'}">
                    </div>

                    <div class="space-y-4">
                        <h3 class="text-xs font-black border-l-4 border-blue-600 pl-2 uppercase">Quản lý danh sách sân</h3>
                        <div class="overflow-x-auto rounded-2xl border border-slate-100">
                            <table class="w-full text-sm text-left">
                                <thead class="bg-slate-50 text-[10px] font-black text-slate-400">
                                    <tr><th class="p-4">STT</th><th class="p-4">Tên sân</th><th class="p-4">Loại</th><th class="p-4">Giá/h</th><th class="p-4 text-center">Xóa</th></tr>
                                </thead>
                                <tbody id="court-list">${(d.ds || []).map((s, i) => renderRow(i+1, s.t, s.l, s.g)).join('')}</tbody>
                            </table>
                        </div>
                    </div>

                    <div class="space-y-4">
                        <div class="flex justify-between items-center"><h3 class="text-xs font-black border-l-4 border-green-500 pl-2 uppercase">Dịch vụ đi kèm (Tự điền)</h3><button onclick="addDichVu()" class="bg-green-100 text-green-700 px-3 py-1 rounded-lg text-[10px] font-bold">+ THÊM DÒNG</button></div>
                        <div id="dv-list" class="space-y-2">${(d.dv || []).map(dv => renderDvRow(dv.n, dv.p)).join('')}</div>
                    </div>

                    <button onclick="saveAll()" class="w-full bg-blue-600 text-white py-5 rounded-2xl font-black shadow-xl hover:scale-[0.98] transition-all">LƯU TOÀN BỘ CẤU HÌNH</button>
                </div>`;
        }

        function renderRow(stt, t, l, g) {
            return `<tr class="border-b last:border-0 hover:bg-slate-50">
                <td class="p-4 text-slate-400 font-bold">${stt}</td>
                <td><input class="w-full p-2 border-none font-bold text-slate-700 c-t" value="${t}"></td>
                <td><span class="bg-blue-50 text-blue-600 px-2 py-1 rounded text-[9px] font-black uppercase c-l">${l}</span></td>
                <td><input class="w-full p-2 border-none font-mono font-bold text-blue-600 c-g" value="${g}"></td>
                <td class="text-center"><button onclick="this.closest('tr').remove()" class="text-red-300 hover:text-red-500">✕</button></td>
            </tr>`;
        }

        function renderDvRow(n="", p="") {
            return `<div class="flex gap-2 p-2 bg-slate-50 rounded-xl border border-slate-100">
                <input class="flex-1 bg-transparent border-none text-xs font-bold dv-n" value="${n}" placeholder="Tên (Nước suối...)">
                <input class="w-24 bg-transparent border-none text-xs font-mono font-bold text-green-600 dv-p" value="${p}" placeholder="Giá">
                <button onclick="this.parentElement.remove()" class="px-2 text-red-300">✕</button>
            </div>`;
        }

        function addDichVu() { document.getElementById("dv-list").insertAdjacentHTML('beforeend', renderDvRow()); }

        function appendCourts() {
            const count = parseInt(document.getElementById("m-count").value);
            const type = document.getElementById("m-type").value;
            if (!count) return;
            const list = document.getElementById("court-list");
            let current = list.querySelectorAll("tr").length;
            for (let i = 1; i <= count; i++) {
                list.insertAdjacentHTML('beforeend', renderRow(current + i, `Sân ${current + i}`, type, 100000));
            }
            document.getElementById("m-count").value = "";
        }

        function previewQR(input) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => { 
                    const img = document.getElementById('m-qr-img');
                    img.src = e.target.result;
                    img.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        }

        async function saveAll() {
            showLoading(true);
            const ds = []; document.querySelectorAll("#court-list tr").forEach(tr => ds.push({ t: tr.querySelector(".c-t").value, l: tr.querySelector(".c-l").innerText, g: tr.querySelector(".c-g").value }));
            const dv = []; document.querySelectorAll("#dv-list > div").forEach(div => dv.push({ n: div.querySelector(".dv-n").value, p: div.querySelector(".dv-p").value }));
            await db.collection("courts").doc(auth.currentUser.uid).set({
                ten: document.getElementById("m-ten").value, dc: document.getElementById("m-dc").value,
                qr: document.getElementById("m-qr-img").src, ds: ds, dv: dv
            });
            showLoading(false);
            alert("Đã lưu cấu hình sân!");
        }

        // --- TAB 2: LỊCH ĐẶT (GRID 30 PHÚT + NHÃN BỘ MÔN) ---
        async function renderBookingGrid() {
            showLoading(true);
            const doc = await db.collection("courts").doc(auth.currentUser.uid).get();
            if (!doc.exists) { showLoading(false); return; }
            const data = doc.data();
            const selectedDate = window.currentDate || new Date().toISOString().split('T')[0];

            document.getElementById("main-content").innerHTML = `
                <div class="card p-5 space-y-4">
                    <div class="flex justify-between items-center">
                        <div class="flex flex-col"><h2 class="sport-font text-blue-600 text-sm">Quản lý đặt sân</h2><p class="text-[9px] text-slate-400 font-bold uppercase">${data.ten}</p></div>
                        <input type="date" id="date-select" value="${selectedDate}" onchange="changeDate(this.value)" class="bg-slate-50 border p-2 rounded-xl text-[10px] font-black text-slate-600 outline-none">
                    </div>

                    <div class="flex gap-2 overflow-x-auto pb-2 no-scrollbar">
                        ${generateQuickDates(selectedDate)}
                    </div>

                    <div class="overflow-x-auto rounded-2xl border border-slate-200">
                        <div class="grid-container" style="--num-courts: ${data.ds.length}">
                            <div class="grid-cell header-cell">GIỜ</div>
                            ${data.ds.map((s, idx) => {
                                const typeColor = s.l === 'Cầu lông' ? 'border-green-500' : s.l === 'Pickleball' ? 'border-blue-500' : 'border-orange-500';
                                const typeLabel = s.l === 'Cầu lông' ? 'CL' : s.l === 'Pickleball' ? 'PB' : 'BĐ';
                                return `
                                    <div class="grid-cell header-cell flex flex-col border-b-4 ${typeColor}">
                                        <span class="text-[10px]">${s.t}</span>
                                        <div class="flex items-center gap-1">
                                            <span class="text-[7px] bg-white/20 px-1 rounded font-black">${typeLabel}</span>
                                            <span class="text-[8px] opacity-60 font-mono">${(s.g/1000)}k</span>
                                        </div>
                                    </div>`;
                            }).join('')}
                            ${generateGridRows(data.ds)}
                        </div>
                    </div>
                </div>
            `;
            await loadBookingStatus(selectedDate);
            showLoading(false);
        }

        function generateQuickDates(selected) {
            let h = "";
            for (let i = 0; i < 7; i++) {
                let d = new Date(); d.setDate(d.getDate() + i);
                let iso = d.toISOString().split('T')[0];
                let active = iso === selected;
                h += `<button onclick="changeDate('${iso}')" class="flex-shrink-0 w-11 h-14 flex flex-col items-center justify-center rounded-2xl border transition-all ${active ? 'bg-blue-600 text-white border-blue-600 shadow-lg' : 'bg-white text-slate-400 border-slate-100'}">
                    <span class="text-[7px] font-bold uppercase">${['CN','T2','T3','T4','T5','T6','T7'][d.getDay()]}</span>
                    <span class="text-xs font-black">${d.getDate()}</span>
                </button>`;
            }
            return h;
        }

        function generateGridRows(courts) {
            let h = "";
            for (let i = 5; i <= 23; i++) {
                [":00", ":30"].forEach(m => {
                    let t = i.toString().padStart(2, '0') + m;
                    h += `<div class="grid-cell cell-time">${t}</div>`;
                    courts.forEach((s, idx) => {
                        h += `<div onclick="toggleCell(this)" class="grid-cell status-empty" 
                              data-slot="slot_${t.replace(':','')}_${idx}" 
                              data-price="${s.g/2}" data-time="${t}">
                            <span class="text-[7px] opacity-20 font-bold">TRỐNG</span>
                        </div>`;
                    });
                });
            }
            return h;
        }

        function toggleCell(el) {
            if (el.classList.contains('status-manual-locked') || el.classList.contains('status-booked')) return;
            el.classList.toggle("is-selecting");
            const sel = document.querySelectorAll(".is-selecting");
            const panel = document.getElementById("lock-panel");
            if (sel.length > 0) {
                panel.classList.remove("hidden");
                let m = 0; sel.forEach(c => m += parseFloat(c.dataset.price));
                document.getElementById("txt-duration").innerText = (sel.length * 0.5) + " GIỜ";
                document.getElementById("txt-money").innerText = m.toLocaleString() + " VNĐ";
            } else { panel.classList.add("hidden"); }
        }

        async function changeDate(d) { window.currentDate = d; await renderBookingGrid(); }

        async function loadBookingStatus(date) {
            const snap = await db.collection("bookings").doc(`${auth.currentUser.uid}_${date}`).get();
            if (!snap.exists) return;
            const data = snap.data();
            Object.keys(data).forEach(key => {
                const cell = document.querySelector(`[data-slot="${key}"]`);
                if (cell) {
                    if (data[key].s === 'locked') { cell.className = "grid-cell status-manual-locked"; cell.innerHTML = "<span>KHÁCH NGOÀI</span>"; }
                    else if (data[key].s === 'booked') { cell.className = "grid-cell status-booked"; cell.innerHTML = "<span>ĐÃ ĐẶT</span>"; }
                }
            });
        }

        async function actionLock(type) {
            showLoading(true);
            const sel = document.querySelectorAll(".is-selecting");
            const date = window.currentDate || new Date().toISOString().split('T')[0];
            const updates = {};
            sel.forEach(el => { updates[el.dataset.slot] = { s: type, p: type === 'locked' ? el.dataset.price : 0 }; });
            await db.collection("bookings").doc(`${auth.currentUser.uid}_${date}`).set(updates, { merge: true });
            document.getElementById("lock-panel").classList.add("hidden");
            await renderBookingGrid();
            showLoading(false);
        }
    </script>
</body>
</html>
