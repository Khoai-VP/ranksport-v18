<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>RankSport v27.7 - Full Ecosystem</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;700;900&display=swap');
        body { font-family: 'Lexend', sans-serif; background: #f8fafc; color: #1e293b; }
        .grid-container { display: grid; grid-template-columns: 90px repeat(var(--num-courts, 1), minmax(130px, 1fr)); gap: 1px; background: #cbd5e1; }
        .grid-cell { background: white; height: 75px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; cursor: pointer; border: 0.5px solid #f1f5f9; }
        .header-cell { background: #0f172a; color: white; position: sticky; top: 0; z-index: 30; font-weight: 900; text-transform: uppercase; font-size: 11px; height: 50px; }
        .cell-time { background: #f8fafc; font-weight: 900; color: #2563eb; position: sticky; left: 0; z-index: 20; border-right: 3px solid #2563eb; }
        
        .is-cl { background: #dcfce7 !important; color: #15803d !important; border-left: 5px solid #22c55e; }
        .is-pb { background: #dbeafe !important; color: #1d4ed8 !important; border-left: 5px solid #3b82f6; }
        .is-pending { background: #fef3c7 !important; color: #b45309 !important; border-left: 5px solid #f59e0b; animation: pulse 1s infinite; }
        .is-selecting { background: #2563eb !important; color: white !important; z-index: 10; transform: scale(0.96); border-radius: 8px; }
        @keyframes pulse { 50% { opacity: 0.7; } }
    </style>
</head>
<body class="pb-24">
    <div id="loading" class="hidden fixed inset-0 bg-white/90 flex flex-col items-center justify-center z-[500]">
        <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
        <p class="mt-4 font-black text-blue-600 uppercase text-[10px]">Đang tải dữ liệu...</p>
    </div>

    <header id="app-header" class="hidden bg-white border-b p-5 sticky top-0 z-50 justify-between items-center shadow-sm">
        <div class="flex items-center gap-3">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="#2563eb"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
            <div>
                <span class="font-black italic text-xl text-slate-800 uppercase leading-none block">RankSport</span>
                <span class="text-[8px] font-bold text-blue-500 uppercase tracking-[0.2em]">Hệ sinh thái thể thao số</span>
            </div>
        </div>
        <button onclick="handleLogout()" class="text-[9px] font-black text-red-500 bg-red-50 px-4 py-2 rounded-xl">THOÁT</button>
    </header>

    <main id="main-content"></main>

    <div id="lock-panel" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 w-[95%] max-w-5xl bg-white border-2 border-blue-600 shadow-2xl rounded-[2.5rem] p-6 z-[100]">
        <div class="grid md:grid-cols-3 gap-6 items-center">
            <div class="flex gap-8">
                <div><p class="text-[9px] font-black text-slate-400 uppercase">Thời lượng</p><div id="txt-duration" class="font-black text-3xl text-blue-600 italic">0H</div></div>
                <div><p class="text-[9px] font-black text-slate-400 uppercase">Tổng cộng</p><div id="txt-money" class="font-black text-2xl text-slate-800">0đ</div></div>
            </div>
            <div class="flex flex-wrap gap-2 bg-slate-50 p-3 rounded-2xl">
                <label class="flex items-center gap-2 text-[10px] font-bold cursor-pointer"><input type="checkbox" class="svc-check" data-price="10000" onchange="calcTotal()"> Nước (10k)</label>
                <label class="flex items-center gap-2 text-[10px] font-bold cursor-pointer"><input type="checkbox" class="svc-check" data-price="5000" onchange="calcTotal()"> Gửi xe (5k)</label>
            </div>
            <div id="panel-actions" class="flex justify-end gap-2"></div>
        </div>
    </div>

    <nav id="nav-bar" class="hidden fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around p-4 z-50 md:max-w-md md:left-1/2 md:-translate-x-1/2 md:bottom-6 md:rounded-full md:border-2 md:shadow-2xl"></nav>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyBpytj0KQybf55iabBzmeg59VL-9oADPHA", authDomain: "badrank-89mrd.firebaseapp.com", projectId: "badrank-89mrd", storageBucket: "badrank-89mrd.appspot.com", messagingSenderId: "951939105470", appId: "1:951939105470:web:968f94f61f94d9b4b08705" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore(); const auth = firebase.auth();
        const fmt = (v) => new Intl.NumberFormat('vi-VN').format(v || 0);
        const getRaw = (s) => parseFloat(s.toString().replace(/\D/g, '')) || 0;
        let currentUserRole = null; let windowTargetCourtId = ""; let basePrice = 0;

        auth.onAuthStateChanged(user => { if(user) { document.getElementById('app-header').classList.replace('hidden','flex'); renderRoleSelection(); } else renderAuth(); });

        function renderAuth() {
            document.getElementById('main-content').innerHTML = `
                <div class="h-screen flex flex-col items-center justify-center text-center p-6">
                    <svg width="80" height="80" viewBox="0 0 24 24" fill="#2563eb" class="mb-6"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                    <h1 class="text-5xl font-black italic uppercase tracking-tighter">RankSport</h1>
                    <p class="text-blue-500 font-bold tracking-[0.4em] text-[10px] mb-12 uppercase italic">Hệ sinh thái thể thao số</p>
                    <button onclick="auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())" class="w-full max-w-xs bg-slate-900 text-white p-6 rounded-2xl font-black uppercase text-xs shadow-xl">Đăng nhập tài khoản</button>
                </div>`;
        }

        function renderRoleSelection() {
            document.getElementById('main-content').innerHTML = `
                <div class="min-h-[80vh] flex flex-col items-center justify-center p-6">
                    <div class="mb-10 text-center">
                        <svg width="50" height="50" viewBox="0 0 24 24" fill="#2563eb" class="mx-auto mb-4"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                        <h2 class="text-3xl font-black italic uppercase tracking-tighter">RankSport</h2>
                        <p class="text-[9px] font-bold text-blue-500 uppercase tracking-widest italic">Hệ sinh thái thể thao số</p>
                    </div>
                    <div class="grid md:grid-cols-2 gap-8 w-full max-w-4xl px-4">
                        <button onclick="initRole('owner')" class="bg-white p-12 rounded-[4rem] border-2 border-slate-50 hover:border-blue-600 shadow-sm text-center">
                            <span class="text-5xl block mb-6">🏟️</span>
                            <span class="font-black text-2xl uppercase italic text-slate-800">CHỦ SÂN</span>
                        </button>
                        <button onclick="initRole('vdv')" class="bg-slate-900 p-12 rounded-[4rem] text-white text-center shadow-2xl">
                            <span class="text-5xl block mb-6">👟</span>
                            <span class="font-black text-2xl uppercase italic">VẬN ĐỘNG VIÊN</span>
                        </button>
                    </div>
                </div>`;
        }

        function initRole(role) {
            currentUserRole = role; document.getElementById('nav-bar').classList.remove('hidden');
            if(role === 'owner') { renderOwnerNav(); renderBookingGrid(); }
            else { renderVDVNav(); switchVDVTab('arena'); }
        }

        function handleLogout() { auth.signOut(); location.reload(); }

        function renderOwnerNav() {
            document.getElementById('nav-bar').innerHTML = `
                <button onclick="renderManagement()" class="flex flex-col items-center text-[9px] font-black text-slate-400 uppercase gap-1"><span>⚙️</span>Cấu hình</button>
                <button onclick="renderBookingGrid()" class="flex flex-col items-center text-[9px] font-black text-blue-600 uppercase gap-1"><span>📅</span>Lịch đặt</button>
                <button onclick="renderRevenue()" class="flex flex-col items-center text-[9px] font-black text-slate-400 uppercase gap-1"><span>💰</span>Doanh thu</button>`;
        }

        function renderVDVNav() {
            document.getElementById('nav-bar').innerHTML = `
                <button onclick="switchVDVTab('rank')" class="flex flex-col items-center text-[9px] font-black text-slate-400 uppercase gap-1"><span>🏆</span>BXH</button>
                <button onclick="switchVDVTab('arena')" class="flex flex-col items-center text-[9px] font-black text-blue-600 uppercase gap-1"><span>⚔️</span>Sân đấu</button>
                <button onclick="switchVDVTab('profile')" class="flex flex-col items-center text-[9px] font-black text-slate-400 uppercase gap-1"><span>👤</span>Hồ sơ</button>`;
        }

        // --- QUẢN LÝ CẤU HÌNH (Sửa lỗi Ảnh 2) ---
        async function renderManagement() {
            showLoading(true);
            const doc = await db.collection("courts").doc(auth.currentUser.uid).get();
            const d = doc.exists ? doc.data() : { ten:"", dc:"", sdt:"", ds:[], imgs:[], qrImg: "", phiCoDinh: 0 };
            showLoading(false);
            document.getElementById("main-content").innerHTML = `
                <div class="grid md:grid-cols-3 gap-8 p-10 animate-fadeIn">
                    <div class="bg-white p-8 rounded-[3rem] border shadow-sm">
                        <h3 class="font-black text-[10px] uppercase text-blue-600 mb-6">Hình ảnh & Thông tin</h3>
                        <div class="grid grid-cols-2 gap-2 mb-6">
                            ${[0,1,2].map(i => `<label class="aspect-square bg-slate-50 rounded-2xl border-2 border-dashed flex items-center justify-center relative overflow-hidden cursor-pointer"><input type="file" class="hidden" onchange="upImg(this, ${i})"><img id="pre-${i}" src="${d.imgs?.[i]||''}" class="${d.imgs?.[i]?'':'hidden'} w-full h-full object-cover absolute"><span class="text-[10px] text-slate-300 font-bold">+ Ảnh</span></label>`).join('')}
                            <label class="aspect-square bg-blue-50 rounded-2xl border-2 border-dashed border-blue-200 flex items-center justify-center relative overflow-hidden cursor-pointer"><input type="file" class="hidden" onchange="upImg(this, 'qr')"><img id="pre-qr" src="${d.qrImg||''}" class="${d.qrImg?'':'hidden'} w-full h-full object-cover absolute"><span class="text-blue-500 font-bold text-[10px]">QR</span></label>
                        </div>
                        <div class="space-y-4">
                            <input id="m-ten" value="${d.ten}" class="w-full p-4 bg-slate-50 rounded-xl font-bold text-xs" placeholder="Tên cụm sân">
                            <input id="m-dc" value="${d.dc}" class="w-full p-4 bg-slate-50 rounded-xl font-bold text-xs" placeholder="Địa chỉ">
                            <div class="p-4 bg-red-50 rounded-xl"><p class="text-[8px] font-black text-red-400 uppercase">Phí vận hành/tháng</p><input id="m-phi" oninput="this.value = fmt(getRaw(this.value))" value="${fmt(d.phiCoDinh)}" class="w-full bg-transparent font-black text-red-600 outline-none"></div>
                        </div>
                    </div>
                    <div class="md:col-span-2 space-y-6">
                        <div class="bg-white p-8 rounded-[3rem] border shadow-sm">
                            <div class="flex justify-between items-center mb-6">
                                <h3 class="font-black text-[10px] uppercase">Danh sách sân</h3>
                                <div class="flex gap-2">
                                    <input id="batch-qty" type="number" value="1" class="w-16 bg-slate-100 p-2 rounded-xl text-center font-black">
                                    <select id="m-type" class="bg-slate-100 text-[10px] font-black p-2 rounded-xl"><option>Cầu lông</option><option>Pickleball</option></select>
                                    <button onclick="addBatch()" class="bg-blue-600 text-white px-4 py-2 rounded-xl font-black text-[10px] uppercase">Thêm nhanh</button>
                                </div>
                            </div>
                            <table class="w-full text-xs" id="court-list">
                                <thead class="border-b text-slate-400 font-black uppercase"><tr class="text-left"><th class="py-4">Tên sân</th><th>Môn</th><th class="text-right">Giá/Giờ (đ)</th><th></th></tr></thead>
                                <tbody class="divide-y divide-slate-50">${(d.ds||[]).map(s=>`<tr class="court-row"><td class="py-4 font-black c-t">${s.t}</td><td class="font-bold text-blue-500 c-l">${s.l}</td><td><input oninput="this.value = fmt(getRaw(this.value))" class="w-full text-right font-black c-g bg-transparent outline-none" value="${fmt(s.g)}"></td><td class="text-right"><button onclick="this.closest('tr').remove()" class="text-red-400 px-4">✕</button></td></tr>`).join('')}</tbody>
                            </table>
                        </div>
                        <button onclick="saveC()" class="w-full bg-slate-900 text-white py-6 rounded-2xl font-black uppercase shadow-xl hover:bg-blue-600 transition">Cập nhật toàn hệ thống</button>
                    </div>
                </div>`;
        }

        function addBatch() {
            const qty = parseInt(document.getElementById('batch-qty').value) || 1;
            const type = document.getElementById('m-type').value;
            const currentCount = document.querySelectorAll('.court-row').length;
            let h = "";
            for(let i=1; i<=qty; i++) {
                h += `<tr class="court-row animate-fadeIn"><td class="py-4 font-black c-t">Sân ${currentCount+i}</td><td class="font-bold text-blue-500 c-l">${type}</td><td><input oninput="this.value = fmt(getRaw(this.value))" class="w-full text-right font-black c-g bg-transparent outline-none" value="100.000"></td><td class="text-right"><button onclick="this.closest('tr').remove()" class="text-red-400 px-4">✕</button></td></tr>`;
            }
            document.querySelector("#court-list tbody").insertAdjacentHTML('beforeend', h);
        }

        async function saveC() {
            showLoading(true);
            const ds = []; document.querySelectorAll(".court-row").forEach(tr => ds.push({ t:tr.querySelector(".c-t").innerText, l:tr.querySelector(".c-l").innerText, g:getRaw(tr.querySelector(".c-g").value) }));
            const imgs = [0,1,2].map(i => document.getElementById(`pre-${i}`).src).filter(s => s.startsWith('data:'));
            const data = { ownerId:auth.currentUser.uid, ten:document.getElementById("m-ten").value, dc:document.getElementById("m-dc").value, sdt: "090...", phiCoDinh: getRaw(document.getElementById('m-phi').value), ds, imgs, qrImg: document.getElementById('pre-qr').src, updatedAt:Date.now() };
            await db.collection("courts").doc(auth.currentUser.uid).set(data);
            await db.collection("public_courts").doc(auth.currentUser.uid).set(data);
            showLoading(false); alert("Lưu cấu hình thành công!");
        }

        function upImg(input, i) {
            const file = input.files[0]; if (!file) return;
            const reader = new FileReader(); reader.onload = (e) => { 
                const id = i === 'qr' ? 'pre-qr' : `pre-${i}`;
                const img = document.getElementById(id); img.src = e.target.result; img.classList.remove('hidden');
            }; reader.readAsDataURL(file);
        }

        // --- LỊCH ĐẶT SÂN (Sửa lỗi Ảnh 3 & Ảnh 5) ---
        function renderBookingGrid() { 
            const uid = auth.currentUser.uid;
            db.collection("courts").doc(uid).get().then(doc => {
                const d = doc.data();
                document.getElementById('main-content').innerHTML = `
                    <div class="bg-white m-10 p-8 rounded-[3rem] border shadow-sm animate-fadeIn">
                        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
                            <h2 class="text-xl font-black italic uppercase">Bảng điều khiển lịch</h2>
                            <div class="flex items-center gap-4">
                                <span class="text-[9px] font-black uppercase flex items-center gap-1"><span class="w-3 h-3 bg-green-200 border-l-4 border-green-500 rounded-sm"></span> Cầu lông</span>
                                <span class="text-[9px] font-black uppercase flex items-center gap-1"><span class="w-3 h-3 bg-blue-200 border-l-4 border-blue-500 rounded-sm"></span> Pickleball</span>
                                <input type="date" id="admin-date" onchange="loadB(this.value, '${uid}')" value="${new Date().toISOString().split('T')[0]}" class="p-3 bg-slate-900 text-white rounded-xl font-black text-[10px] uppercase outline-none">
                            </div>
                        </div>
                        <div class="overflow-x-auto rounded-[2rem] border-2 border-slate-100 no-scrollbar">
                            <div class="grid-container" style="--num-courts:${d.ds.length}">
                                <div class="grid-cell header-cell italic">Giờ</div>
                                ${d.ds.map(s => `<div class="grid-cell header-cell">${s.t}<br><span class="text-[8px] text-blue-400 font-bold uppercase">${s.l === "Cầu lông" ? "CL" : "PB"}</span></div>`).join('')}
                                ${generateRows(d.ds)}
                            </div>
                        </div>
                    </div>`;
                loadB(new Date().toISOString().split('T')[0], uid);
            });
        }

        function generateRows(courts) {
            let h = ""; for (let i=5; i<=23; i++) { [":00", ":30"].forEach(m => {
                let t = i.toString().padStart(2,'0')+m; h += `<div class="grid-cell cell-time">${t}</div>`;
                courts.forEach((s, idx) => { h += `<div onclick="toggle(this)" class="grid-cell" data-slot="slot_${t.replace(':','')}_${idx}" data-price="${s.g/2}" data-type="${s.l}"></div>`; });
            }); } return h;
        }

        function toggle(el) {
            if(el.classList.contains('is-cl') || el.classList.contains('is-pb') || el.classList.contains('is-pending')) return;
            el.classList.toggle("is-selecting");
            const sel = document.querySelectorAll(".is-selecting");
            const panel = document.getElementById("lock-panel");
            if(sel.length > 0) {
                panel.classList.remove("hidden");
                basePrice = 0; sel.forEach(c => basePrice += parseFloat(c.dataset.price));
                document.getElementById("txt-duration").innerText = (sel.length * 0.5) + " GIỜ";
                calcTotal();
                const actions = document.getElementById("panel-actions");
                if(currentUserRole === 'owner') actions.innerHTML = `<button onclick="actionLock('locked')" class="bg-blue-600 text-white px-8 py-4 rounded-2xl font-black text-[10px] uppercase shadow-xl">Xác nhận khóa</button>`;
                else actions.innerHTML = `<button onclick="vdvPayPopup()" class="bg-emerald-600 text-white px-8 py-4 rounded-2xl font-black text-[10px] uppercase shadow-xl">Thanh toán</button>`;
            } else panel.classList.add("hidden");
        }

        function calcTotal() {
            let svc = 0; document.querySelectorAll(".svc-check:checked").forEach(c => svc += parseFloat(c.dataset.price));
            document.getElementById("txt-money").innerText = fmt(basePrice + svc) + "đ";
        }

        async function loadB(date, ownerId) {
            document.querySelectorAll(".grid-cell:not(.header-cell):not(.cell-time)").forEach(el => { el.className = "grid-cell"; el.innerHTML = ""; el.onclick = () => toggle(el); });
            const snap = await db.collection("bookings").doc(`${ownerId}_${date}`).get();
            if(!snap.exists) return; const b = snap.data();
            Object.keys(b).forEach(k => {
                const el = document.querySelector(`[data-slot="${k}"]`); if(!el) return;
                const d = b[k]; 
                if(d.s === 'pending') {
                    el.className = "grid-cell is-pending"; 
                    el.innerHTML = `<span class="text-[9px] font-black uppercase">DUYỆT BILL</span><span class="text-[8px] font-bold opacity-70">${d.u.split(' ')[0]}</span>`;
                    if(currentUserRole === 'owner') el.onclick = (e) => { e.stopPropagation(); showReview(d, k, date, ownerId); };
                } else if(d.s === 'locked') {
                    el.className = "grid-cell " + (d.type === "Pickleball" ? "is-pb" : "is-cl"); 
                    el.innerHTML = `<span class="text-[10px] font-black uppercase">${d.u.split(' ')[0]}</span><span class="text-[9px] font-bold">${fmt(d.p + (d.svc||0))}đ</span>`;
                    if(currentUserRole === 'owner') el.onclick = (e) => { e.stopPropagation(); if(confirm("Mở khóa sân này?")) unlockSlot(k, date, ownerId); };
                }
            });
        }

        async function unlockSlot(slotKey, date, ownerId) {
            showLoading(true); await db.collection("bookings").doc(`${ownerId}_${date}`).update({ [slotKey]: firebase.firestore.FieldValue.delete() });
            showLoading(false); renderBookingGrid();
        }

        // --- TÀI CHÍNH (Sửa lỗi Ảnh 4) ---
        async function renderRevenue() {
            const area = document.getElementById('main-content'); showLoading(true);
            const date = document.getElementById('admin-date')?.value || new Date().toISOString().split('T')[0];
            const courtDoc = await db.collection("courts").doc(auth.currentUser.uid).get();
            const snap = await db.collection("bookings").doc(`${auth.currentUser.uid}_${date}`).get();
            showLoading(false);
            
            let cl = 0, pb = 0, svc = 0;
            if(snap.exists) Object.values(snap.data()).forEach(v => {
                if(v.s === 'locked') {
                    if(v.type === "Pickleball") pb += v.p; else cl += v.p;
                    svc += (v.svc || 0);
                }
            });
            const phiThang = courtDoc.exists ? (courtDoc.data().phiCoDinh || 0) : 0;
            const total = cl + pb + svc; const thucThu = total - (phiThang/30);

            area.innerHTML = `
                <div class="space-y-6 p-10 animate-fadeIn pb-20">
                    <div class="grid md:grid-cols-4 gap-4">
                        <div class="bg-white p-8 rounded-[2.5rem] border shadow-sm"><p class="text-[9px] font-black text-slate-400 uppercase italic">Thực thu hôm nay</p><h3 class="text-3xl font-black text-slate-900 mt-1">${fmt(thucThu)}đ</h3></div>
                        <div class="bg-green-50 p-8 rounded-[2.5rem] border-2 border-green-100"><p class="text-[9px] font-black text-green-600 uppercase italic">Cầu lông</p><h3 class="text-xl font-black text-green-700 mt-1">${fmt(cl)}đ</h3></div>
                        <div class="bg-blue-50 p-8 rounded-[2.5rem] border-2 border-blue-100"><p class="text-[9px] font-black text-blue-600 uppercase italic">Pickleball</p><h3 class="text-xl font-black text-blue-700 mt-1">${fmt(pb)}đ</h3></div>
                        <div class="bg-slate-900 p-8 rounded-[2.5rem] shadow-xl text-white"><p class="text-[9px] font-black text-slate-400 uppercase italic">Dịch vụ</p><h3 class="text-3xl font-black text-blue-400 mt-1">+${fmt(svc)}đ</h3></div>
                    </div>
                    <div class="grid md:grid-cols-2 gap-6">
                        <div class="bg-white p-10 rounded-[3rem] border shadow-sm">
                            <h4 class="font-black text-xs uppercase mb-6 italic text-slate-400">Doanh thu tuần này</h4>
                            <canvas id="revChart" height="200"></canvas>
                        </div>
                        <div class="bg-blue-600 p-10 rounded-[3rem] text-white flex flex-col justify-between">
                            <div>
                                <h4 class="font-black text-sm uppercase italic mb-4">Trợ lý gợi ý AI</h4>
                                <p class="text-sm font-bold text-blue-100 leading-relaxed">
                                    Dựa trên thực tế, ${(cl > pb) ? 'Cầu lông đang quá tải, bạn nên cân nhắc tăng giá vào khung giờ vàng.' : 'Pickleball đang phát triển tốt, hãy tổ chức giải đấu nội bộ.'}
                                    <br><br>Số tiền dịch vụ đang chiếm ${(svc/total*100).toFixed(1)}% tổng thu. Hãy đẩy mạnh bán nước tăng lực.
                                </p>
                            </div>
                            <button class="w-full bg-white text-blue-600 py-4 rounded-2xl font-black uppercase text-[10px] mt-8">Báo cáo kinh doanh chi tiết</button>
                        </div>
                    </div>
                </div>`;
                
            new Chart(document.getElementById('revChart'), { 
                type:'bar', data:{ labels:['T2','T3','T4','T5','T6','T7','CN'], datasets:[{ label: 'Doanh thu', data:[15, 20, 18, 25, 30, 45, 40], backgroundColor:'#2563eb', borderRadius:12 }] },
                options: { plugins: { legend: { display: false } }, scales: { y: { display: false }, x: { grid: { display: false } } } }
            });
        }

        // --- VẬN ĐỘNG VIÊN ---
        function switchVDVTab(tab) {
            const area = document.getElementById('main-content');
            if(tab === 'arena') renderArena(area);
            if(tab === 'profile') renderProfile(area);
            if(tab === 'rank') renderRank(area);
        }

        async function renderArena(el) {
            showLoading(true); const snap = await db.collection("public_courts").get(); showLoading(false);
            let h = `<div class="p-10"><h2 class="font-black italic text-3xl mb-10 text-slate-800 uppercase tracking-tighter">Sàn đấu đang mở</h2><div class="grid md:grid-cols-3 gap-8">`;
            snap.forEach(doc => {
                const d = doc.data();
                h += `<div onclick="viewCourtDetail('${doc.id}')" class="group bg-white rounded-[3rem] overflow-hidden border shadow-sm cursor-pointer hover:border-blue-600 transition-all"><img src="${d.imgs?.[0]||''}" class="w-full h-52 object-cover transition-transform group-hover:scale-105"><div class="p-8"><h3 class="font-black text-xl uppercase italic text-slate-900">${d.ten}</h3><p class="text-[10px] font-bold text-slate-400 mt-1 uppercase">${d.dc}</p><div class="mt-8 flex justify-between items-center"><span class="text-blue-600 font-black text-sm italic">${fmt(d.ds[0]?.g || 0)}đ/h</span><span class="bg-slate-900 text-white px-6 py-3 rounded-2xl font-black text-[9px] uppercase tracking-widest">ĐẶT SÂN</span></div></div></div>`;
            });
            el.innerHTML = h + `</div></div>`;
        }

        async function viewCourtDetail(ownerId) {
            showLoading(true); const doc = await db.collection("courts").doc(ownerId).get();
            const d = doc.data(); windowTargetCourtId = ownerId; showLoading(false);
            document.getElementById('main-content').innerHTML = `
                <div class="p-10 space-y-6 animate-fadeIn pb-20">
                    <button onclick="switchVDVTab('arena')" class="text-[9px] font-black text-slate-400 uppercase italic">← Quay lại sàn đấu</button>
                    <div class="flex flex-col md:flex-row justify-between items-end gap-4">
                        <div><h2 class="font-black text-4xl italic uppercase text-slate-800 tracking-tighter">${d.ten}</h2><p class="text-[10px] font-bold text-slate-400 uppercase mt-1 italic tracking-widest">Hệ sinh thái RankSport</p></div>
                        <input type="date" id="target-date" onchange="loadB(this.value, '${ownerId}')" value="${new Date().toISOString().split('T')[0]}" class="p-4 bg-white border-2 border-slate-100 rounded-2xl font-black text-[10px] outline-none shadow-sm">
                    </div>
                    <div class="bg-white p-6 rounded-[3rem] border shadow-sm overflow-x-auto no-scrollbar">
                        <div class="grid-container" style="--num-courts:${d.ds.length}">
                            <div class="grid-cell header-cell italic">Giờ</div>
                            ${d.ds.map(s => `<div class="grid-cell header-cell">${s.t}<br><span class="text-[8px] opacity-40 uppercase">${s.l === "Cầu lông" ? "CL" : "PB"}</span></div>`).join('')}
                            ${generateRows(d.ds)}
                        </div>
                    </div>
                </div>`;
            loadB(new Date().toISOString().split('T')[0], ownerId);
        }

        async function vdvPayPopup() {
            showLoading(true); const doc = await db.collection("courts").doc(windowTargetCourtId).get(); const qr = doc.data().qrImg; showLoading(false);
            let svc = 0; document.querySelectorAll(".svc-check:checked").forEach(c => svc += parseFloat(c.dataset.price));
            const total = basePrice + svc;
            document.body.insertAdjacentHTML('beforeend', `<div id="vdv-pay" class="fixed inset-0 bg-slate-900/95 z-[200] flex items-center justify-center p-6"><div class="bg-white w-full max-w-sm rounded-[3.5rem] p-10 text-center animate-fadeIn shadow-2xl relative"><button onclick="document.getElementById('vdv-pay').remove()" class="absolute top-8 right-8 font-black text-slate-300">✕</button><h3 class="font-black italic text-blue-600 uppercase text-xl mb-6">Thanh toán vé đấu</h3><img src="${qr}" class="w-full rounded-[2rem] border mb-6"><div class="bg-slate-50 p-6 rounded-2xl text-left mb-6"><p class="text-[9px] font-black text-slate-400 uppercase">Số tiền chuyển khoản</p><p class="text-3xl font-black text-slate-900 tracking-tighter">${fmt(total)}đ</p></div><label class="block w-full bg-blue-600 text-white py-5 rounded-2xl font-black uppercase text-[10px] cursor-pointer shadow-xl">Tải hóa đơn lên<input type="file" class="hidden" onchange="uploadBill(this)"></label></div></div>`);
        }

        async function uploadBill(input) {
            const file = input.files[0]; if(!file) return;
            showLoading(true); const reader = new FileReader(); reader.onload = async (e) => {
                const updates = {}; const timestamp = Date.now(); const sel = document.querySelectorAll(".is-selecting");
                let svcVal = 0; document.querySelectorAll(".svc-check:checked").forEach(c => svcVal += parseFloat(c.dataset.price));
                const date = document.getElementById('target-date').value;
                sel.forEach((el, i) => { 
                    updates[el.dataset.slot] = { s:'pending', p:parseFloat(el.dataset.price), type: el.dataset.type, svc: i===0?svcVal:0, t:timestamp, u:auth.currentUser.displayName, bill: i===0?e.target.result:"linked" }; 
                });
                await db.collection("bookings").doc(`${windowTargetCourtId}_${date}`).set(updates, {merge:true});
                showLoading(false); document.getElementById('vdv-pay').remove(); document.getElementById('lock-panel').classList.add('hidden');
                loadB(date, windowTargetCourtId);
            }; reader.readAsDataURL(file);
        }

        function showReview(d, k, date, ownerId) {
            document.body.insertAdjacentHTML('beforeend', `<div id="review-modal" class="fixed inset-0 bg-slate-900/95 z-[200] flex items-center justify-center p-6"><div class="bg-white w-full max-w-md rounded-[3rem] p-8 text-center animate-fadeIn shadow-2xl"><h3 class="font-black text-slate-800 uppercase text-xs mb-6 italic">Xác thực giao dịch</h3><img src="${d.bill}" class="w-full rounded-2xl border max-h-96 object-contain mb-6 bg-slate-50"><div class="flex gap-2"><button onclick="confirmS('${k}', '${date}', '${ownerId}', '${d.type}')" class="flex-1 bg-blue-600 text-white py-5 rounded-2xl font-black uppercase text-[10px] shadow-xl">Xác nhận OK</button><button onclick="document.getElementById('review-modal').remove()" class="px-8 font-black text-[10px] uppercase text-slate-400">Đóng</button></div></div></div>`);
        }

        async function confirmS(k, d, o, type) {
            showLoading(true); await db.collection("bookings").doc(`${o}_${d}`).set({ [k]: { s:'locked', type: type } }, {merge:true});
            document.getElementById('review-modal').remove(); showLoading(false); renderBookingGrid();
        }

        function renderProfile(el) { el.innerHTML = `<div class="p-10 max-w-3xl mx-auto"><div class="bg-slate-900 p-16 rounded-[4rem] text-white shadow-2xl text-center"><h2 class="text-5xl font-black italic uppercase tracking-tighter">${auth.currentUser.displayName}</h2><p class="mt-4 text-blue-400 font-black text-xs tracking-widest uppercase italic">Xếp hạng: Kim cương</p></div></div>`; }
        function renderRank(el) { el.innerHTML = `<div class="p-10 max-w-3xl mx-auto"><h2 class="font-black italic text-2xl mb-10 uppercase text-slate-800">Bảng vàng RankSport</h2><div class="space-y-4">${[1,2,3].map(i => `<div class="bg-white p-6 rounded-[2.5rem] flex items-center justify-between border shadow-sm"><span class="font-black italic text-2xl text-blue-600 w-12">#${i}</span><span class="font-black text-sm uppercase italic">Người chơi ${i}</span><span class="font-black text-xl">1,500</span></div>`).join('')}</div></div>`; }
        function showLoading(s) { document.getElementById('loading').classList.toggle('hidden', !s); }
        async function actionLock(status) {
            showLoading(true); const date = document.getElementById('admin-date').value;
            const sel = document.querySelectorAll(".is-selecting"); const updates = {};
            let svcVal = 0; document.querySelectorAll(".svc-check:checked").forEach(c => svcVal += parseFloat(c.dataset.price));
            sel.forEach((el, i) => updates[el.dataset.slot] = { s: status, p: parseFloat(el.dataset.price), type: el.dataset.type, svc: i===0?svcVal:0, u: "Quản lý" });
            await db.collection("bookings").doc(`${auth.currentUser.uid}_${date}`).set(updates, {merge:true});
            document.getElementById("lock-panel").classList.add("hidden"); showLoading(false); renderBookingGrid();
        }
    </script>
</body>
</html>
