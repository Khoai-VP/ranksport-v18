<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>RankSport Pro v25.0</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;700;900&display=swap');
        :root { --primary: #3b82f6; --bg: #0f172a; --card: #1e293b; }
        body { font-family: 'Lexend', sans-serif; background: var(--bg); color: #f1f5f9; -webkit-tap-highlight-color: transparent; }
        
        /* Grid cho Máy tính & Điện thoại */
        .grid-container { 
            display: grid; 
            grid-template-columns: 80px repeat(var(--num-courts, 1), minmax(120px, 1fr)); 
            background: #334155; 
            gap: 1px;
            border: 1px solid #334155;
        }
        .grid-cell { 
            background: var(--card); 
            height: 60px; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            transition: all 0.2s;
            font-size: 13px; /* Chữ to hơn cho PC */
        }
        .grid-cell:hover { background: #2d3a4f; }
        
        .header-cell { 
            background: #020617; 
            color: #94a3b8; 
            position: sticky; 
            top: 0; 
            z-index: 30; 
            font-weight: 900; 
            text-transform: uppercase;
            font-size: 11px;
        }
        .cell-time { 
            background: #020617; 
            font-weight: 800; 
            color: var(--primary);
            position: sticky; 
            left: 0; 
            z-index: 20; 
        }

        /* Trạng thái ô */
        .is-cl { background: #064e3b !important; color: #34d399 !important; border-top: 3px solid #10b981; }
        .is-pb { background: #1e3a8a !important; color: #93c5fd !important; border-top: 3px solid #3b82f6; }
        .is-pending { background: #78350f !important; color: #fbbf24 !important; animation: pulse 1.5s infinite; }
        .is-selecting { background: var(--primary) !important; color: white !important; transform: scale(0.95); z-index: 10; border-radius: 8px; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
        
        input, select { background: #334155 !important; color: white !important; border: 1px solid #475569 !important; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-24">
    <div id="loading" class="hidden fixed inset-0 bg-slate-900/90 flex flex-col items-center justify-center z-[300]">
        <div class="animate-spin rounded-full h-12 w-12 border-t-4 border-blue-500 mb-4"></div>
        <p class="font-black text-blue-500 uppercase tracking-widest text-sm">Đang đồng bộ dữ liệu...</p>
    </div>

    <header class="bg-slate-900 border-b border-slate-800 p-5 sticky top-0 z-50 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center font-black italic shadow-lg shadow-blue-500/20">R</div>
            <span class="font-black italic text-2xl text-white uppercase tracking-tighter">RankSport <span class="text-blue-500">Pro</span></span>
        </div>
        <div id="header-user" class="hidden items-center gap-4">
            <span id="user-info" class="hidden md:block text-xs font-bold text-slate-400 uppercase tracking-widest">...</span>
            <button onclick="handleLogout()" class="text-xs font-black text-red-400 border border-red-400/30 px-4 py-2 rounded-xl hover:bg-red-400/10 transition">THOÁT</button>
        </div>
    </header>

    <main id="main-content" class="p-4 md:p-8 max-w-6xl mx-auto"></main>

    <div id="lock-panel" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 w-[95%] max-w-2xl bg-blue-600 shadow-2xl rounded-[2rem] p-6 z-[100] text-white animate-fadeIn">
        <div class="flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="text-center md:text-left">
                <div id="txt-duration" class="font-black text-3xl italic">0 GIỜ</div>
                <div id="txt-money" class="text-blue-100 text-xs font-bold uppercase tracking-widest">0đ Tổng phí</div>
            </div>
            <div class="flex items-center gap-3">
                <div class="text-right">
                    <p class="text-[10px] text-blue-200 font-black mb-1 uppercase italic">Dịch vụ</p>
                    <input type="number" id="svc-price" class="bg-blue-700/50 text-white font-black text-center rounded-lg p-2 w-24 outline-none" placeholder="0">
                </div>
                <div id="panel-actions" class="flex gap-2"></div>
            </div>
        </div>
    </div>

    <nav id="nav-bar" class="hidden fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 flex justify-around p-4 z-50 shadow-2xl md:max-w-xs md:left-auto md:right-6 md:bottom-6 md:rounded-3xl md:border"></nav>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyBpytj0KQybf55iabBzmeg59VL-9oADPHA", authDomain: "badrank-89mrd.firebaseapp.com", projectId: "badrank-89mrd", storageBucket: "badrank-89mrd.appspot.com", messagingSenderId: "951939105470", appId: "1:951939105470:web:968f94f61f94d9b4b08705" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore(); const auth = firebase.auth();
        const fmt = (v) => new Intl.NumberFormat('vi-VN').format(v || 0);
        const getRaw = (s) => parseFloat(s.toString().replace(/\D/g, '')) || 0;
        let currentUserRole = null; let windowTargetCourtId = "";

        auth.onAuthStateChanged(user => {
            if(user) {
                document.getElementById('header-user').classList.add('flex');
                document.getElementById('user-info').innerText = user.displayName;
                renderRoleSelection();
            } else renderAuth();
        });

        function renderAuth() {
            document.getElementById('main-content').innerHTML = `
                <div class="h-[70vh] flex flex-col items-center justify-center gap-8">
                    <div class="text-center">
                        <h1 class="text-6xl font-black italic text-white mb-2">RANKSPORT</h1>
                        <p class="text-blue-500 font-bold tracking-[0.5em] text-sm">MANAGEMENT SYSTEM</p>
                    </div>
                    <button onclick="auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())" class="w-full max-w-xs bg-white text-slate-900 p-5 rounded-2xl font-black shadow-2xl hover:bg-blue-500 hover:text-white transition-all uppercase text-sm tracking-widest">Đăng nhập với Google</button>
                </div>`;
        }

        function renderRoleSelection() {
            document.getElementById('main-content').innerHTML = `
                <div class="h-[60vh] flex flex-col items-center justify-center gap-6">
                    <p class="font-bold text-slate-400 uppercase tracking-widest text-xs">Vui lòng chọn vai trò</p>
                    <div class="grid md:grid-cols-2 gap-6 w-full max-w-2xl">
                        <button onclick="initRole('owner')" class="group bg-slate-800 p-10 rounded-[2.5rem] border border-slate-700 hover:border-blue-500 transition-all">
                            <div class="text-4xl mb-4 group-hover:scale-110 transition">🏟️</div>
                            <div class="font-black text-xl text-white uppercase italic">Chủ sân</div>
                            <p class="text-xs text-slate-500 mt-2">Quản lý lịch, doanh thu & cấu hình</p>
                        </button>
                        <button onclick="initRole('vdv')" class="group bg-blue-600 p-10 rounded-[2.5rem] shadow-xl shadow-blue-500/20 hover:bg-blue-500 transition-all">
                            <div class="text-4xl mb-4 group-hover:scale-110 transition">👟</div>
                            <div class="font-black text-xl text-white uppercase italic">Vận động viên</div>
                            <p class="text-blue-100 text-xs mt-2">Tìm sân, đặt chỗ & xem bảng xếp hạng</p>
                        </button>
                    </div>
                </div>`;
        }

        function initRole(role) {
            currentUserRole = role;
            document.getElementById('nav-bar').classList.remove('hidden');
            if(role === 'owner') { renderOwnerNav(); renderBookingGrid(); }
            else { renderVDVNav(); switchVDVTab('arena'); }
        }

        function handleLogout() { auth.signOut().then(() => location.reload()); }

        function renderOwnerNav() {
            const active = "text-blue-500";
            document.getElementById('nav-bar').innerHTML = `
                <button onclick="renderManagement()" class="flex flex-col items-center text-[10px] font-black text-slate-500 uppercase gap-1 hover:text-white"><span>⚙️</span>Cấu hình</button>
                <button onclick="renderBookingGrid()" class="flex flex-col items-center text-[10px] font-black ${active} uppercase gap-1"><span>📅</span>Lịch đặt</button>
                <button onclick="renderRevenue()" class="flex flex-col items-center text-[10px] font-black text-slate-500 uppercase gap-1 hover:text-white"><span>💰</span>Doanh thu</button>
            `;
        }

        function renderVDVNav() {
            document.getElementById('nav-bar').innerHTML = `
                <button onclick="switchVDVTab('rank')" class="flex flex-col items-center text-[10px] font-black text-slate-500 uppercase gap-1 hover:text-white"><span>🏆</span>BXH</button>
                <button onclick="switchVDVTab('arena')" class="flex flex-col items-center text-[10px] font-black text-blue-500 uppercase gap-1"><span>⚔️</span>Sàn đấu</button>
                <button onclick="switchVDVTab('profile')" class="flex flex-col items-center text-[10px] font-black text-slate-500 uppercase gap-1 hover:text-white"><span>👤</span>Profile</button>
            `;
        }

        // --- CẤU HÌNH HỆ THỐNG ---
        async function renderManagement() {
            showLoading(true);
            const doc = await db.collection("courts").doc(auth.currentUser.uid).get();
            const d = doc.exists ? doc.data() : { ten:"", dc:"", sdt:"", ds:[], imgs:[], qrImg: "" };
            showLoading(false);
            document.getElementById("main-content").innerHTML = `
                <div class="grid md:grid-cols-3 gap-8 pb-20 animate-fadeIn">
                    <div class="md:col-span-1 space-y-6">
                        <div class="bg-slate-800 p-8 rounded-[2rem] border border-slate-700">
                            <h2 class="font-black text-blue-500 mb-6 uppercase text-xs italic tracking-widest">Hình ảnh & QR Bank</h2>
                            <div class="grid grid-cols-2 gap-3 mb-6">
                                ${[0,1,2].map(i => `<label class="aspect-square bg-slate-900 rounded-2xl flex items-center justify-center cursor-pointer border-2 border-dashed border-slate-700 overflow-hidden relative"><input type="file" class="hidden" onchange="upImg(this, ${i})"><img id="pre-${i}" src="${d.imgs?.[i]||''}" class="${d.imgs?.[i]?'':'hidden'} w-full h-full object-cover absolute"><span class="text-slate-600 font-black">+ Ảnh</span></label>`).join('')}
                                <label class="aspect-square bg-blue-900/20 rounded-2xl flex items-center justify-center cursor-pointer border-2 border-dashed border-blue-500/30 overflow-hidden relative"><input type="file" class="hidden" onchange="upImg(this, 'qr')"><img id="pre-qr" src="${d.qrImg||''}" class="${d.qrImg?'':'hidden'} w-full h-full object-cover absolute"><span class="text-blue-500 font-black text-[10px]">QR BANK</span></label>
                            </div>
                            <input id="m-ten" value="${d.ten}" class="w-full p-4 rounded-xl font-bold mb-3 text-sm" placeholder="Tên cụm sân">
                            <input id="m-dc" value="${d.dc}" class="w-full p-4 rounded-xl font-bold mb-3 text-sm" placeholder="Địa chỉ">
                            <input id="m-sdt" value="${d.sdt}" class="w-full p-4 rounded-xl font-bold text-sm" placeholder="Số điện thoại">
                        </div>
                    </div>
                    <div class="md:col-span-2 space-y-6">
                        <div class="bg-slate-800 p-8 rounded-[2rem] border border-slate-700">
                            <div class="flex justify-between items-center mb-6">
                                <h2 class="font-black text-emerald-500 uppercase text-xs italic tracking-widest">Danh sách sân chi tiết</h2>
                                <div class="flex gap-2">
                                    <select id="m-type" class="text-[10px] font-black p-2 rounded-xl"><option>Cầu lông</option><option>Pickleball</option></select>
                                    <button onclick="addC()" class="bg-emerald-600 text-white px-6 py-2 rounded-xl font-black text-xs hover:bg-emerald-500">+ THÊM SÂN</button>
                                </div>
                            </div>
                            <div class="overflow-x-auto">
                                <table class="w-full text-sm" id="court-list">
                                    <thead><tr class="text-slate-500 text-[10px] uppercase border-b border-slate-700"><th class="text-left py-4">Tên sân</th><th class="text-left">Loại</th><th class="text-right">Giá / Giờ</th><th></th></tr></thead>
                                    <tbody>${(d.ds||[]).map(s=>`<tr class="border-b border-slate-700/50"><td class="py-4 font-black c-t text-white">${s.t}</td><td class="font-bold text-slate-400 c-l">${s.l}</td><td><input class="w-full text-right font-black text-blue-400 c-g bg-transparent" value="${fmt(s.g)}"></td><td class="text-right"><button onclick="this.closest('tr').remove()" class="text-red-400 font-bold px-4">✕</button></td></tr>`).join('')}</tbody>
                                </table>
                            </div>
                        </div>
                        <button onclick="saveC()" class="w-full bg-blue-600 text-white py-6 rounded-2xl font-black uppercase shadow-2xl hover:bg-blue-500 transition-all tracking-[0.2em]">Cập nhật toàn bộ hệ thống</button>
                    </div>
                </div>`;
        }

        function addC(){
            const t = document.getElementById("m-type").value;
            const h = `<tr class="border-b border-slate-700/50"><td class="py-4 font-black c-t text-white">Sân mới</td><td class="font-bold text-slate-400 c-l">${t}</td><td><input class="w-full text-right font-black text-blue-400 c-g bg-transparent" value="100.000"></td><td class="text-right"><button onclick="this.closest('tr').remove()" class="text-red-400 font-bold px-4">✕</button></td></tr>`;
            document.querySelector("#court-list tbody").innerHTML += h;
        }

        async function saveC() {
            showLoading(true);
            const ds = []; document.querySelectorAll("#court-list tbody tr").forEach(tr => ds.push({ t:tr.querySelector(".c-t").innerText, l:tr.querySelector(".c-l").innerText, g:getRaw(tr.querySelector(".c-g").value) }));
            const imgElems = [0,1,2].map(i => document.getElementById(`pre-${i}`).src).filter(s => s.startsWith('data:'));
            const qrRaw = document.getElementById('pre-qr').src;

            const data = { ownerId:auth.currentUser.uid, ten:document.getElementById("m-ten").value, dc:document.getElementById("m-dc").value, sdt:document.getElementById("m-sdt").value, ds, imgs:imgElems, qrImg:qrRaw, updatedAt:Date.now() };
            await db.collection("courts").doc(auth.currentUser.uid).set(data);
            await db.collection("public_courts").doc(auth.currentUser.uid).set(data);
            showLoading(false); alert("Đã lưu hệ thống!");
        }

        function upImg(input, i) {
            const file = input.files[0]; if (!file) return;
            const reader = new FileReader(); reader.onload = (e) => { 
                const id = i === 'qr' ? 'pre-qr' : `pre-${i}`;
                const img = document.getElementById(id); img.src = e.target.result; img.classList.remove('hidden');
            }; reader.readAsDataURL(file);
        }

        // --- LỊCH ĐẶT CHÍNH ---
        function renderBookingGrid() { 
            const uid = auth.currentUser.uid;
            db.collection("courts").doc(uid).get().then(doc => {
                if(!doc.exists) return renderManagement();
                const d = doc.data();
                document.getElementById('main-content').innerHTML = `
                    <div class="bg-slate-800 p-6 rounded-[2.5rem] border border-slate-700 shadow-2xl animate-fadeIn">
                        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
                            <h2 class="text-xl font-black italic text-white uppercase tracking-tighter">Bảng điều khiển lịch đặt</h2>
                            <input type="date" id="admin-date" onchange="loadB(this.value, '${uid}')" value="${new Date().toISOString().split('T')[0]}" class="p-4 rounded-xl font-black text-sm outline-none">
                        </div>
                        <div class="overflow-x-auto rounded-3xl border border-slate-700 no-scrollbar">
                            <div class="grid-container" style="--num-courts:${d.ds.length}">
                                <div class="grid-cell header-cell">Thời gian</div>
                                ${d.ds.map(s => `<div class="grid-cell header-cell">${s.t}<br><span class="text-[8px] opacity-50">${s.l}</span></div>`).join('')}
                                ${generateRows(d.ds)}
                            </div>
                        </div>
                    </div>`;
                loadB(new Date().toISOString().split('T')[0], uid);
            });
        }

        function generateRows(courts) {
            let h = ""; for (let i=5; i<=23; i++) { [":00", ":30"].forEach(m => {
                let t = i.toString().padStart(2,'0')+m; h += `<div class="grid-cell cell-time">${t}</div>`;
                courts.forEach((s, idx) => { h += `<div onclick="toggle(this)" class="grid-cell" data-slot="slot_${t.replace(':','')}_${idx}" data-price="${s.g/2}" data-type="${s.l}"></div>`; });
            }); } return h;
        }

        function toggle(el) {
            if(el.classList.contains('is-cl') || el.classList.contains('is-pb') || el.classList.contains('is-pending')) return;
            el.classList.toggle("is-selecting");
            const sel = document.querySelectorAll(".is-selecting");
            const panel = document.getElementById("lock-panel");
            if(sel.length > 0) {
                panel.classList.remove("hidden");
                let m = 0; sel.forEach(c => m += parseFloat(c.dataset.price));
                document.getElementById("txt-duration").innerText = (sel.length * 0.5) + " GIỜ";
                document.getElementById("txt-money").innerText = fmt(m) + "đ";
                const actions = document.getElementById("panel-actions");
                if(currentUserRole === 'owner') actions.innerHTML = `<button onclick="actionLock('locked')" class="bg-white text-blue-600 px-8 py-4 rounded-xl font-black text-xs uppercase hover:bg-blue-50 transition">XÁC NHẬN KHÓA</button>`;
                else actions.innerHTML = `<button onclick="vdvPayPopup()" class="bg-emerald-500 text-white px-8 py-4 rounded-xl font-black text-xs uppercase hover:bg-emerald-400 transition shadow-lg">ĐẶT SÂN NGAY</button>`;
            } else panel.classList.add("hidden");
        }

        async function loadB(date, ownerId) {
            document.querySelectorAll(".grid-cell:not(.header-cell):not(.cell-time)").forEach(el => { el.className = "grid-cell"; el.innerHTML = ""; el.onclick = () => toggle(el); });
            const snap = await db.collection("bookings").doc(`${ownerId}_${date}`).get();
            if(!snap.exists) return; const b = snap.data(); const now = Date.now();
            Object.keys(b).forEach(k => {
                const el = document.querySelector(`[data-slot="${k}"]`); if(!el) return;
                const d = b[k]; 
                if(d.s === 'pending') {
                    el.className = "grid-cell is-pending"; el.innerHTML = `<span class="text-[9px] font-black">XN BILL</span><span class="text-[7px] opacity-70">${d.u.split(' ')[0]}</span>`;
                    if(currentUserRole === 'owner') el.onclick = (e) => { e.stopPropagation(); showReview(d, k, date, ownerId); };
                } else if(d.s === 'locked') {
                    const cls = el.dataset.type === "Pickleball" ? "is-pb" : "is-cl";
                    el.className = "grid-cell " + cls; 
                    el.innerHTML = `<span class="text-[9px] font-black uppercase">${d.u.split(' ')[0]}</span><span class="text-[8px] font-bold">${fmt(d.p + (d.svc||0))}đ</span>`;
                    if(currentUserRole === 'owner') el.onclick = (e) => { e.stopPropagation(); if(confirm("Mở khóa ca này?")) unlockSlot(k, date, ownerId); };
                    else el.onclick = null;
                }
            });
        }

        async function unlockSlot(slotKey, date, ownerId) {
            showLoading(true); await db.collection("bookings").doc(`${ownerId}_${date}`).update({ [slotKey]: firebase.firestore.FieldValue.delete() });
            showLoading(false); if(currentUserRole === 'owner') renderBookingGrid(); else loadB(date, ownerId);
        }

        // --- DOANH THU & VĐV ---
        async function renderRevenue() {
            const area = document.getElementById('main-content'); showLoading(true);
            const date = document.getElementById('admin-date')?.value || new Date().toISOString().split('T')[0];
            const snap = await db.collection("bookings").doc(`${auth.currentUser.uid}_${date}`).get();
            showLoading(false);
            let total = 0; if(snap.exists) Object.values(snap.data()).forEach(v => { if(v.s === 'locked') total += (v.p + (v.svc||0)); });
            area.innerHTML = `
                <div class="grid md:grid-cols-2 gap-8 animate-fadeIn">
                    <div class="bg-slate-800 p-12 rounded-[3rem] border border-slate-700 text-center flex flex-col justify-center">
                        <p class="text-xs font-black text-slate-500 uppercase italic mb-2 tracking-widest">Tổng thu nhập ngày ${date}</p>
                        <h2 class="text-6xl font-black text-white tracking-tighter">${fmt(total)}đ</h2>
                        <div class="mt-8 flex justify-center gap-4 text-[10px] font-black uppercase">
                            <span class="text-emerald-500">↑ 12% so với hôm qua</span>
                        </div>
                    </div>
                    <div class="bg-slate-800 p-8 rounded-[3rem] border border-slate-700"><canvas id="revChart" height="200"></canvas></div>
                </div>`;
            new Chart(document.getElementById('revChart'), { type:'line', data:{ labels:['Sáng','Trưa','Chiều','Tối'], datasets:[{ data:[total*0.1, total*0.3, total*0.5, total*0.8], borderColor:'#3b82f6', tension:0.4, borderWidth:4, pointRadius:4, pointBackgroundColor:'#fff' }] }, options:{ plugins:{ legend:{ display:false } }, scales:{ x:{ grid:{display:false} }, y:{ display:false } } } });
        }

        function switchVDVTab(tab) {
            const area = document.getElementById('main-content');
            if(tab === 'arena') renderArena(area);
            if(tab === 'profile') renderProfile(area);
            if(tab === 'rank') renderRank(area);
        }

        async function renderArena(el) {
            showLoading(true); const snap = await db.collection("public_courts").get(); showLoading(false);
            let h = `<h2 class="font-black italic text-2xl mb-8 text-white uppercase tracking-tighter">Sàn đấu đang mở cửa</h2><div class="grid md:grid-cols-3 gap-6">`;
            snap.forEach(doc => {
                const d = doc.data();
                h += `<div onclick="viewCourtDetail('${doc.id}')" class="bg-slate-800 rounded-[2.5rem] overflow-hidden shadow-2xl border border-slate-700 hover:border-blue-500 transition group cursor-pointer"><img src="${d.imgs?.[0]||''}" class="w-full h-48 object-cover group-hover:scale-105 transition duration-500"><div class="p-6"><div><h3 class="font-black text-lg uppercase italic text-white">${d.ten}</h3><p class="text-[10px] font-bold text-slate-500 mt-1 uppercase">${d.dc}</p></div><div class="mt-6 flex justify-between items-center"><span class="text-[10px] font-black text-blue-500 uppercase tracking-widest">Xem lịch sân ➔</span></div></div></div>`;
            });
            el.innerHTML = h + `</div>`;
        }

        async function viewCourtDetail(ownerId) {
            showLoading(true); const doc = await db.collection("courts").doc(ownerId).get();
            const d = doc.data(); windowTargetCourtId = ownerId; showLoading(false);
            document.getElementById('main-content').innerHTML = `
                <div class="space-y-6 pb-20 animate-fadeIn">
                    <button onclick="switchVDVTab('arena')" class="text-xs font-black text-slate-500 uppercase hover:text-white transition">← Quay lại danh sách</button>
                    <div class="flex flex-col md:flex-row justify-between items-end gap-4">
                        <div><h2 class="font-black text-4xl italic uppercase text-white tracking-tighter">${d.ten}</h2><p class="text-xs font-bold text-slate-500 uppercase tracking-widest mt-1">${d.dc}</p></div>
                        <input type="date" id="target-date" onchange="loadB(this.value, '${ownerId}')" value="${new Date().toISOString().split('T')[0]}" class="p-4 rounded-xl font-black text-sm outline-none">
                    </div>
                    <div class="bg-slate-800 p-6 rounded-[3rem] border border-slate-700 shadow-2xl overflow-x-auto no-scrollbar">
                        <div class="grid-container" style="--num-courts:${d.ds.length}">
                            <div class="grid-cell header-cell">Giờ</div>
                            ${d.ds.map(s => `<div class="grid-cell header-cell">${s.t}<br><span class="text-[8px] opacity-40">${s.l}</span></div>`).join('')}
                            ${generateRows(d.ds)}
                        </div>
                    </div>
                </div>`;
            loadB(new Date().toISOString().split('T')[0], ownerId);
        }

        async function vdvPayPopup() {
            showLoading(true); const doc = await db.collection("courts").doc(windowTargetCourtId).get(); const qr = doc.data().qrImg; showLoading(false);
            const total = getRaw(document.getElementById('txt-money').innerText) + getRaw(document.getElementById('svc-price').value);
            document.body.insertAdjacentHTML('beforeend', `<div id="vdv-pay" class="fixed inset-0 bg-slate-900/95 z-[200] flex items-center justify-center p-6"><div class="bg-slate-800 w-full max-w-sm rounded-[3rem] p-10 text-center border border-slate-700 animate-fadeIn shadow-2xl"><h3 class="font-black italic text-blue-500 uppercase text-xl mb-6">Xác nhận thanh toán</h3><img src="${qr}" class="w-full rounded-3xl border border-slate-700 mb-6"><div class="bg-slate-900 p-5 rounded-2xl text-left mb-6 border border-slate-700"><p class="text-[10px] font-black text-slate-500 uppercase">Số tiền chuyển khoản</p><p class="text-2xl font-black text-white">${fmt(total)}đ</p></div><label class="block w-full bg-blue-600 text-white py-5 rounded-2xl font-black uppercase text-xs cursor-pointer shadow-xl shadow-blue-500/20 hover:bg-blue-500">Tải lên hóa đơn (Bill)<input type="file" class="hidden" onchange="uploadBill(this)"></label><button onclick="document.getElementById('vdv-pay').remove()" class="mt-6 text-slate-500 font-bold text-xs uppercase hover:text-white">Hủy giao dịch</button></div></div>`);
        }

        async function uploadBill(input) {
            const file = input.files[0]; if(!file) return;
            showLoading(true); const reader = new FileReader(); reader.onload = async (e) => {
                const updates = {}; const timestamp = Date.now(); const sel = document.querySelectorAll(".is-selecting");
                const svcVal = getRaw(document.getElementById('svc-price').value);
                sel.forEach((el, i) => { updates[el.dataset.slot] = { s:'pending', p:parseFloat(el.dataset.price), svc: i===0?svcVal:0, t:timestamp, u:auth.currentUser.displayName, bill: i===0?e.target.result:"linked" }; });
                await db.collection("bookings").doc(`${windowTargetCourtId}_${document.getElementById('target-date').value}`).set(updates, {merge:true});
                showLoading(false); document.getElementById('vdv-pay').remove(); document.getElementById('lock-panel').classList.add('hidden');
                loadB(document.getElementById('target-date').value, windowTargetCourtId);
                alert("Đã gửi xác nhận đặt sân!");
            }; reader.readAsDataURL(file);
        }

        function showReview(d, k, date, ownerId) {
            document.body.insertAdjacentHTML('beforeend', `<div id="review-modal" class="fixed inset-0 bg-slate-900/95 z-[200] flex items-center justify-center p-6"><div class="bg-slate-800 w-full max-w-sm rounded-[3rem] p-8 text-center border border-slate-700 animate-fadeIn shadow-2xl"><h3 class="font-black text-white uppercase text-sm mb-6 tracking-widest italic">Kiểm tra giao dịch</h3><img src="${d.bill}" class="w-full rounded-2xl border border-slate-700 max-h-80 object-contain mb-6"><div class="text-left bg-slate-900 p-5 rounded-2xl border border-slate-700 mb-6"><p class="text-[10px] font-black text-blue-500 uppercase mb-1">${d.u}</p><p class="text-lg font-black text-white">Sân: ${fmt(d.p)}đ + DV: ${fmt(d.svc)}đ</p></div><button onclick="confirmS('${k}', '${date}', '${ownerId}')" class="w-full bg-blue-600 text-white py-5 rounded-2xl font-black uppercase text-xs shadow-xl shadow-blue-500/20">Xác nhận & Khóa lịch</button><button onclick="document.getElementById('review-modal').remove()" class="mt-6 text-slate-500 font-bold text-xs uppercase hover:text-white">Bỏ qua</button></div></div>`);
        }

        async function confirmS(k, d, o) {
            showLoading(true); await db.collection("bookings").doc(`${o}_${d}`).set({ [k]: { s:'locked' } }, {merge:true});
            document.getElementById('review-modal').remove(); showLoading(false); renderBookingGrid();
        }

        function renderProfile(el) {
            el.innerHTML = `<div class="space-y-6 animate-fadeIn max-w-2xl mx-auto"><div class="bg-gradient-to-br from-blue-700 to-blue-900 p-12 rounded-[3rem] text-white relative overflow-hidden shadow-2xl"><div class="relative z-10"><h2 class="text-4xl font-black italic uppercase tracking-tighter">${auth.currentUser.displayName}</h2><div class="flex gap-3 mt-6"><span class="bg-white/20 px-6 py-2 rounded-full text-[10px] font-black uppercase">ELO: 1,200</span><span class="bg-emerald-400 text-slate-900 px-6 py-2 rounded-full text-[10px] font-black uppercase">Professional</span></div></div><div class="absolute -right-8 -bottom-8 text-white/10 font-black text-9xl italic">RANK</div></div><div class="grid grid-cols-2 gap-6"><div class="bg-slate-800 p-10 rounded-[2.5rem] border border-slate-700 text-center shadow-xl"><p class="text-[10px] font-black text-slate-500 uppercase mb-2">Thắng</p><p class="text-3xl font-black text-white">0</p></div><div class="bg-slate-800 p-10 rounded-[2.5rem] border border-slate-700 text-center shadow-xl"><p class="text-[10px] font-black text-slate-500 uppercase mb-2">Thua</p><p class="text-3xl font-black text-white">0</p></div></div></div>`;
        }

        function renderRank(el) {
            el.innerHTML = `<div class="max-w-3xl mx-auto animate-fadeIn"><h2 class="font-black italic text-3xl mb-8 uppercase tracking-tighter text-white">Bảng xếp hạng liên đoàn</h2><div class="space-y-4">${[1,2,3,4,5].map(i => `<div class="bg-slate-800 p-6 rounded-3xl flex items-center justify-between border border-slate-700 hover:border-blue-500/50 transition shadow-xl"><div class="flex items-center gap-6"><span class="font-black italic text-2xl text-blue-500 w-10">#${i}</span><div class="w-14 h-14 bg-slate-900 rounded-2xl border border-slate-700"></div><div><span class="font-black text-sm text-white uppercase block">VĐV Đỉnh cao ${i}</span><span class="text-[10px] font-bold text-slate-500 uppercase">Cấp độ: Diamond</span></div></div><div class="text-right"><span class="font-black text-lg text-white">1,2${i}0</span><p class="text-[8px] font-black text-emerald-500 uppercase">Point</p></div></div>`).join('')}</div></div>`;
        }

        function showLoading(s) { document.getElementById('loading').classList.toggle('hidden', !s); }
        async function actionLock(status) {
            showLoading(true); const date = document.getElementById('admin-date').value;
            const sel = document.querySelectorAll(".is-selecting"); const updates = {};
            const svcVal = getRaw(document.getElementById('svc-price').value);
            sel.forEach((el, i) => updates[el.dataset.slot] = { s: status, p: parseFloat(el.dataset.price), svc: i===0?svcVal:0, u: "Owner" });
            await db.collection("bookings").doc(`${auth.currentUser.uid}_${date}`).set(updates, {merge:true});
            document.getElementById("lock-panel").classList.add("hidden"); showLoading(false); renderBookingGrid();
        }
    </script>
</body>
</html>
