<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>RankSport - Fix Undefined & Nav</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Inter:wght@400;600&display=swap');
        .sport-font { font-family: 'Oswald', sans-serif; text-transform: uppercase; }
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: white; }
        .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="pb-24">

    <div id="loading" class="hidden fixed inset-0 bg-black bg-opacity-80 flex flex-col items-center justify-center z-50">
        <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-lime-400"></div>
    </div>

    <div id="login-screen" class="min-h-screen hidden flex flex-col justify-center items-center px-6">
        <h1 class="text-6xl sport-font italic text-lime-400 leading-none font-bold">RANK<span class="text-white">SPORT</span></h1>
        <button id="btn-login" class="mt-12 w-full max-w-xs bg-white text-black font-bold py-4 px-6 rounded-full flex items-center justify-center gap-3 shadow-xl">
            ĐĂNG NHẬP VỚI GOOGLE
        </button>
    </div>

    <div id="app" class="hidden">
        <header class="bg-slate-900 border-b border-slate-800 p-4 flex justify-between items-center sticky top-0 z-40">
            <span class="sport-font text-xl text-lime-400 italic font-bold">RANK<span class="text-white">S</span></span>
            <div class="flex items-center gap-3">
                <span id="user-name" class="text-[10px] font-semibold uppercase text-gray-400"></span>
                <button id="btn-logout" class="text-[10px] border border-red-500 text-red-500 px-2 py-1 rounded">THOÁT</button>
            </div>
        </header>

        <div id="role-screen" class="hidden p-8 flex flex-col items-center justify-center min-h-[70vh]">
            <h2 class="text-2xl sport-font italic mb-8">BẠN LÀ AI?</h2>
            <div class="grid grid-cols-1 gap-4 w-full max-w-sm">
                <button onclick="chonVaiTro('player')" class="glass-card p-6 rounded-xl hover:border-lime-400 transition-all text-center">
                    <div class="text-3xl mb-1">👟</div>
                    <div class="sport-font text-xl text-lime-400 font-bold">VẬN ĐỘNG VIÊN</div>
                </button>
                <button onclick="chonVaiTro('owner')" class="glass-card p-6 rounded-xl hover:border-blue-400 transition-all text-center">
                    <div class="text-3xl mb-1">🏟️</div>
                    <div class="sport-font text-xl text-blue-400 font-bold">CHỦ SÂN</div>
                </button>
            </div>
        </div>

        <main id="main-content" class="p-6"></main>

        <nav id="bottom-nav" class="fixed bottom-0 left-0 right-0 bg-slate-900/90 backdrop-blur-md border-t border-slate-800 flex justify-around p-3 shadow-2xl"></nav>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBpytj0KQybf55iabBzmeg59VL-9oADPHA",
            authDomain: "badrank-89mrd.firebaseapp.com",
            projectId: "badrank-89mrd",
            storageBucket: "badrank-89mrd.appspot.com",
            messagingSenderId: "951939105470",
            appId: "1:951939105470:web:968f94f61f94d9b4b08705"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const provider = new firebase.auth.GoogleAuthProvider();

        function hienLoading(bat) {
            document.getElementById("loading").classList.toggle("hidden", !bat);
        }

        document.getElementById("btn-login").onclick = () => {
            hienLoading(true);
            auth.signInWithPopup(provider).catch(err => { hienLoading(false); alert(err.message); });
        };

        document.getElementById("btn-logout").onclick = () => auth.signOut();

        auth.onAuthStateChanged(async (user) => {
            hienLoading(true);
            if (!user) {
                document.getElementById("login-screen").classList.remove("hidden");
                document.getElementById("app").classList.add("hidden");
                hienLoading(false);
                return;
            }

            document.getElementById("login-screen").classList.add("hidden");
            document.getElementById("app").classList.remove("hidden");
            document.getElementById("user-name").innerText = user.displayName;

            const userDoc = await db.collection("users").doc(user.uid).get();
            if (!userDoc.exists) {
                document.getElementById("role-screen").classList.remove("hidden");
                document.getElementById("bottom-nav").classList.add("hidden");
            } else {
                document.getElementById("role-screen").classList.add("hidden");
                document.getElementById("bottom-nav").classList.remove("hidden");
                setupNavigation(userDoc.data().vaiTro);
            }
            hienLoading(false);
        });

        async function chonVaiTro(vaiTro) {
            hienLoading(true);
            const user = auth.currentUser;
            const duLieu = {
                uid: user.uid, ten: user.displayName, email: user.email,
                vaiTro: vaiTro, taoLuc: firebase.firestore.FieldValue.serverTimestamp()
            };
            try {
                await db.collection("users").doc(user.uid).set(duLieu);
                document.getElementById("role-screen").classList.add("hidden");
                document.getElementById("bottom-nav").classList.remove("hidden");
                setupNavigation(vaiTro); // Truyền trực tiếp giá trị 'vaiTro' vào đây
            } catch (e) { alert(e.message); }
            finally { hienLoading(false); }
        }

        function setupNavigation(vaiTro) {
            const nav = document.getElementById("bottom-nav");
            const main = document.getElementById("main-content");
            nav.innerHTML = "";

            const tabs = vaiTro === 'player' 
                ? [ {n: 'SÀN ĐẤU', i: '🏟️'}, {n: 'HẠNG', i: '🏆'}, {n: 'HỒ SƠ', i: '👤'} ]
                : [ {n: 'SÂN CỦA TÔI', i: '📊'}, {n: 'LỊCH ĐẶT', i: '📅'}, {n: 'DOANH THU', i: '💰'} ];

            tabs.forEach((tab, index) => {
                const btn = document.createElement('button');
                btn.className = "flex flex-col items-center gap-1 text-[9px] sport-font text-gray-500 font-bold";
                if(index === 0) btn.className += " text-lime-400";
                btn.innerHTML = `<span class="text-xl">${tab.i}</span>${tab.n}`;
                btn.onclick = () => {
                    document.querySelectorAll('#bottom-nav button').forEach(b => b.classList.remove('text-lime-400'));
                    btn.classList.add('text-lime-400');
                    main.innerHTML = `<div class="glass-card p-10 rounded-xl text-center"><h2 class="sport-font text-xl">ĐANG TẢI ${tab.n}...</h2></div>`;
                };
                nav.appendChild(btn);
            });

            // Giao diện chào mừng đầu tiên
            const vaiTroTiengViet = vaiTro === 'player' ? 'VẬN ĐỘNG VIÊN' : 'CHỦ SÂN';
            main.innerHTML = `
                <div class="glass-card p-8 rounded-2xl border border-lime-400/30 text-center">
                    <h2 class="sport-font text-2xl text-lime-400 italic">XÁC THỰC THÀNH CÔNG</h2>
                    <p class="text-white font-bold mt-2 uppercase tracking-widest">${vaiTroTiengViet}</p>
                    <hr class="my-4 border-slate-800">
                    <p class="text-xs text-gray-400 leading-relaxed italic">Menu bên dưới đã được thiết lập theo vai trò của bạn. Hãy thử nhấn các tab!</p>
                </div>
            `;
        }
    </script>
</body>
</html>
