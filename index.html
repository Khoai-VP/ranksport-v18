<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>RankSport - Module 5: Chủ Sân Linh Hoạt</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Inter:wght@400;600&display=swap');
        .sport-font { font-family: 'Oswald', sans-serif; text-transform: uppercase; }
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: white; }
        .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        input, textarea { background: rgba(255,255,255,0.08) !important; border: 1px solid rgba(255,255,255,0.1) !important; color: white !important; }
        input:focus, textarea:focus { border-color: #3b82f6 !important; outline: none; }
    </style>
</head>
<body class="pb-24">

    <div id="loading" class="hidden fixed inset-0 bg-black bg-opacity-80 flex flex-col items-center justify-center z-50">
        <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-lime-400"></div>
    </div>

    <div id="app">
        <header class="bg-slate-900 border-b border-slate-800 p-4 flex justify-between items-center sticky top-0 z-40">
            <span class="sport-font text-xl text-lime-400 italic font-bold">RANK<span class="text-white">S</span></span>
            <div class="flex items-center gap-3">
                <span id="user-name" class="text-[10px] font-semibold uppercase text-gray-400"></span>
                <button id="btn-logout" class="text-[10px] border border-red-500 text-red-500 px-2 py-1 rounded">THOÁT</button>
            </div>
        </header>

        <main id="main-content" class="p-4"></main>
        <nav id="bottom-nav" class="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-md border-t border-slate-800 flex justify-around p-3 shadow-2xl"></nav>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBpytj0KQybf55iabBzmeg59VL-9oADPHA",
            authDomain: "badrank-89mrd.firebaseapp.com",
            projectId: "badrank-89mrd",
            storageBucket: "badrank-89mrd.appspot.com",
            messagingSenderId: "951939105470",
            appId: "1:951939105470:web:968f94f61f94d9b4b08705"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const provider = new firebase.auth.GoogleAuthProvider();

        function hienLoading(bat) { document.getElementById("loading").classList.toggle("hidden", !bat); }
        document.getElementById("btn-logout").onclick = () => auth.signOut();

        auth.onAuthStateChanged(async (user) => {
            if (!user) { window.location.reload(); return; }
            document.getElementById("user-name").innerText = user.displayName;
            const userDoc = await db.collection("users").doc(user.uid).get();
            if (userDoc.exists) setupNavigation(userDoc.data().vaiTro);
        });

        function setupNavigation(vaiTro) {
            const nav = document.getElementById("bottom-nav");
            const tabs = vaiTro === 'player' 
                ? [ {n: 'SÀN ĐẤU', i: '🏟️', f: () => {}}, {n: 'XẾP HẠNG', i: '🏆', f: () => {}}, {n: 'HỒ SƠ', i: '👤', f: () => {}} ]
                : [ {n: 'QUẢN LÝ', i: '📊', f: renderOwnerCourts}, {n: 'LỊCH ĐẶT', i: '📅', f: () => {}}, {n: 'CÀI ĐẶT', i: '⚙️', f: () => {}} ];

            nav.innerHTML = "";
            tabs.forEach((tab, index) => {
                const btn = document.createElement('button');
                btn.className = `flex flex-col items-center gap-1 text-[9px] sport-font font-bold ${index === 0 ? 'text-blue-400' : 'text-gray-500'}`;
                btn.innerHTML = `<span class="text-2xl">${tab.i}</span>${tab.n}`;
                btn.onclick = () => {
                    document.querySelectorAll('#bottom-nav button').forEach(b => b.classList.replace('text-blue-400', 'text-gray-500'));
                    btn.classList.replace('text-gray-500', 'text-blue-400');
                    tab.f();
                };
                nav.appendChild(btn);
            });
            tabs[0].f();
        }

        // --- GIAO DIỆN QUẢN LÝ SÂN TỰ NHẬP ---
        async function renderOwnerCourts() {
            hienLoading(true);
            const main = document.getElementById("main-content");
            const user = auth.currentUser;
            const courtDoc = await db.collection("courts").doc(user.uid).get();
            const d = courtDoc.exists ? courtDoc.data() : { ten: "", dc: "", gia: "", dv: "", qr: "" };
            hienLoading(false);

            main.innerHTML = `
                <div class="glass-card p-6 rounded-2xl border border-blue-400/20">
                    <h2 class="sport-font text-xl text-blue-400 mb-6 italic tracking-widest">Thiết lập dịch vụ sân</h2>
                    
                    <div class="space-y-5">
                        <div class="group">
                            <label class="text-[10px] text-gray-500 uppercase font-bold ml-1">Tên cụm sân / Tên sân</label>
                            <input id="in-ten" type="text" value="${d.ten}" class="w-full p-4 rounded-xl mt-1 transition-all" placeholder="VD: Cầu Lông Pro - Sân A1">
                        </div>

                        <div>
                            <label class="text-[10px] text-gray-500 uppercase font-bold ml-1">Vị trí / Địa chỉ</label>
                            <input id="in-dc" type="text" value="${d.dc}" class="w-full p-4 rounded-xl mt-1" placeholder="Số nhà, tên đường, quận...">
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="text-[10px] text-gray-500 uppercase font-bold ml-1">Giá thuê (VND/h)</label>
                                <input id="in-gia" type="text" value="${d.gia}" class="w-full p-4 rounded-xl mt-1" placeholder="VD: 80.000">
                            </div>
                            <div>
                                <label class="text-[10px] text-gray-500 uppercase font-bold ml-1">Link QR nhận tiền</label>
                                <input id="in-qr" type="text" value="${d.qr}" class="w-full p-4 rounded-xl mt-1" placeholder="Dán link ảnh QR">
                            </div>
                        </div>

                        <div>
                            <label class="text-[10px] text-gray-500 uppercase font-bold ml-1">Mô tả dịch vụ & Tiện ích</label>
                            <textarea id="in-dv" rows="3" class="w-full p-4 rounded-xl mt-1 transition-all" placeholder="VD: Có thảm xanh, đèn led chống chói, trà đá miễn phí...">${d.dv}</textarea>
                        </div>

                        <button onclick="luuData()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-5 rounded-2xl shadow-2xl transition-all transform active:scale-95 sport-font tracking-widest mt-4">
                            XÁC NHẬN CẬP NHẬT
                        </button>
                    </div>
                </div>
            `;
        }

        async function luuData() {
            hienLoading(true);
            const user = auth.currentUser;
            const data = {
                ownerId: user.uid,
                ten: document.getElementById("in-ten").value,
                dc: document.getElementById("in-dc").value,
                gia: document.getElementById("in-gia").value,
                dv: document.getElementById("in-dv").value,
                qr: document.getElementById("in-qr").value,
                update: firebase.firestore.FieldValue.serverTimestamp()
            };
            try {
                await db.collection("courts").doc(user.uid).set(data);
                alert("Đã lưu cấu hình sân của bạn!");
            } catch (e) { alert(e.message); }
            finally { hienLoading(false); }
        }
    </script>
</body>
</html>
