<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>RankSport Pro - Quản Lý Hybrid Thông Minh</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Oswald:wght@700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; margin: 0; }
        .sport-font { font-family: 'Oswald', sans-serif; text-transform: uppercase; }
        .grid-container { display: grid; grid-template-columns: 75px repeat(var(--num-courts, 1), minmax(110px, 1fr)); border: 1px solid #cbd5e1; background: white; }
        .grid-cell { border: 0.5px solid #e2e8f0; height: 48px; display: flex; align-items: center; justify-content: center; font-size: 10px; cursor: pointer; transition: 0.2s; }
        .cell-time { background: #f8fafc; font-weight: bold; border-right: 2px solid #cbd5e1; position: sticky; left: 0; z-index: 10; font-size: 11px; color: #64748b; }
        .header-cell { background: #0f172a; color: white; position: sticky; top: 0; z-index: 20; font-family: 'Oswald'; }
        .status-manual-locked { background: #0f172a !important; color: #fbbf24 !important; font-weight: 800; border: 1px solid #fbbf24 !important; }
        .status-booked { background: #dc2626 !important; color: white !important; font-weight: bold; }
        .is-selecting { background: #dbeafe; border: 2.5px solid #2563eb !important; z-index: 5; }
        .card { background: white; border-radius: 20px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-40">

    <div id="loading" class="hidden fixed inset-0 bg-white/90 flex flex-col items-center justify-center z-[100]">
        <div class="animate-spin rounded-full h-12 w-12 border-t-4 border-blue-600 border-r-4 border-r-transparent"></div>
        <p class="text-[11px] font-black mt-4 text-slate-900 tracking-widest uppercase">Đang cập nhật hệ thống...</p>
    </div>

    <header class="bg-white border-b p-4 sticky top-0 z-40 flex justify-between items-center shadow-sm">
        <span class="sport-font text-2xl text-blue-600 italic font-black">RANK<span class="text-slate-900">S</span></span>
        <div id="user-info" class="text-[10px] font-bold text-slate-500 bg-slate-100 px-3 py-1.5 rounded-full uppercase italic">...</div>
    </header>

    <main id="main-content" class="p-4 max-w-6xl mx-auto space-y-6"></main>

    <div id="lock-panel" class="hidden fixed bottom-28 left-4 right-4 bg-slate-900 shadow-2xl rounded-2xl p-5 flex justify-between items-center z-[100] border border-white/20">
        <div class="flex flex-col">
            <span id="txt-duration" class="text-white font-black text-lg leading-tight">0 GIỜ</span>
            <span id="txt-money" class="text-blue-400 text-[11px] font-bold italic">0 VNĐ</span>
        </div>
        <div class="flex gap-2">
            <button onclick="actionLock('locked')" class="bg-amber-400 text-slate-900 px-6 py-3 rounded-xl text-[11px] font-black uppercase tracking-tight">KHÓA SÂN</button>
            <button onclick="actionLock('empty')" class="bg-slate-700 text-white px-6 py-3 rounded-xl text-[11px] font-black uppercase tracking-tight">MỞ TRỐNG</button>
        </div>
    </div>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around p-4 z-50 shadow-lg">
        <button onclick="renderManagement()" class="flex flex-col items-center gap-1 text-[10px] font-bold text-slate-400 hover:text-blue-600"><span>⚙️</span>CẤU HÌNH</button>
        <button onclick="renderBookingGrid()" class="flex flex-col items-center gap-1 text-[10px] font-bold text-slate-400 hover:text-blue-600"><span>📅</span>LỊCH ĐẶT</button>
    </nav>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBpytj0KQybf55iabBzmeg59VL-9oADPHA",
            authDomain: "badrank-89mrd.firebaseapp.com",
            projectId: "badrank-89mrd",
            storageBucket: "badrank-89mrd.appspot.com",
            messagingSenderId: "951939105470",
            appId: "1:951939105470:web:968f94f61f94d9b4b08705"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        auth.onAuthStateChanged(user => { 
            if (user) {
                document.getElementById('user-info').innerText = user.displayName;
                renderManagement(); 
            } else { renderLogin(); }
        });

        function showLoading(s) { document.getElementById('loading').classList.toggle('hidden', !s); }

        function renderLogin() {
            document.getElementById('main-content').innerHTML = `
                <div class="h-[60vh] flex items-center justify-center">
                    <button onclick="auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())" class="bg-blue-600 text-white px-10 py-5 rounded-2xl font-black sport-font shadow-xl hover:bg-blue-700 transition-all">ĐĂNG NHẬP CHỦ SÂN</button>
                </div>`;
        }

        // --- 1. TAB CẤU HÌNH (LOGIC TỰ ĐỘNG ĐÁNH SỐ THEO LOẠI) ---
        async function renderManagement() {
            showLoading(true);
            const doc = await db.collection("courts").doc(auth.currentUser.uid).get();
            const d = doc.exists ? doc.data() : { ten: "", dc: "", qr: "", ds: [], dv: [] };
            showLoading(false);

            document.getElementById("main-content").innerHTML = `
                <div class="card p-6 space-y-8">
                    <div class="space-y-4">
                        <h2 class="sport-font text-blue-600 text-xl tracking-tight">Cấu hình cơ sở Hybrid</h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <input id="m-ten" value="${d.ten}" class="p-4 border rounded-2xl text-sm bg-slate-50 font-bold" placeholder="Tên cụm sân">
                            <input id="m-dc" value="${d.dc}" class="p-4 border rounded-2xl text-sm bg-slate-50" placeholder="Địa chỉ sân">
                        </div>
                    </div>

                    <div class="bg-slate-900 p-5 rounded-3xl flex flex-wrap gap-4 items-center shadow-inner">
                        <div class="flex-1">
                            <p class="text-[10px] text-slate-400 font-bold mb-1 uppercase">Chọn loại sân thêm mới</p>
                            <select id="m-type" class="w-full p-3 rounded-xl border-none text-sm font-bold bg-white outline-none focus:ring-2 focus:ring-blue-500"><option>Cầu lông</option><option>Pickleball</option></select>
                        </div>
                        <div class="w-24">
                            <p class="text-[10px] text-slate-400 font-bold mb-1 uppercase">Số lượng</p>
                            <input id="m-count" type="number" class="w-full p-3 rounded-xl border-none text-sm font-bold bg-white" placeholder="0">
                        </div>
                        <button onclick="appendCourts()" class="bg-blue-600 text-white px-8 py-3 rounded-xl text-[11px] font-black uppercase mt-4 md:mt-0 shadow-lg shadow-blue-500/30">THÊM VÀO DANH SÁCH</button>
                    </div>

                    <div class="space-y-4">
                        <h3 class="text-xs font-black border-l-4 border-blue-600 pl-3 uppercase italic">Danh sách sân đang hoạt động</h3>
                        <div class="overflow-x-auto rounded-2xl border border-slate-200">
                            <table class="w-full text-sm text-left">
                                <thead class="bg-slate-50 text-[10px] font-black text-slate-400 border-b">
                                    <tr><th class="p-4">STT</th><th class="p-4">Tên sân (Có nhãn)</th><th class="p-4">Bộ môn</th><th class="p-4">Giá/h</th><th class="p-4 text-center">Xóa</th></tr>
                                </thead>
                                <tbody id="court-list">${(d.ds || []).map((s, i) => renderRow(i+1, s.t, s.l, s.g)).join('')}</tbody>
                            </table>
                        </div>
                    </div>

                    <div class="space-y-4">
                        <div class="flex justify-between items-center"><h3 class="text-xs font-black border-l-4 border-green-500 pl-3 uppercase italic">Phí dịch vụ khác</h3><button onclick="addDichVu()" class="text-green-600 text-[10px] font-black underline">+ THÊM DÒNG MỚI</button></div>
                        <div id="dv-list" class="grid grid-cols-1 md:grid-cols-2 gap-3">${(d.dv || []).map(dv => renderDvRow(dv.n, dv.p)).join('')}</div>
                    </div>

                    <button onclick="saveAll()" class="w-full bg-blue-600 text-white py-5 rounded-2xl font-black shadow-xl hover:scale-[0.99] active:scale-95 transition-all text-sm uppercase tracking-widest">LƯU CẤU HÌNH VẬN HÀNH</button>
                </div>`;
        }

        function renderRow(stt, t, l, g) {
            return `<tr class="border-b last:border-0 hover:bg-slate-50 transition-colors">
                <td class="p-4 text-slate-300 font-black">${stt}</td>
                <td><input class="w-full p-2 border-none font-black text-slate-800 c-t bg-transparent" value="${t}"></td>
                <td><span class="bg-slate-100 text-slate-600 px-3 py-1 rounded-lg text-[9px] font-black uppercase c-l">${l}</span></td>
                <td><input class="w-full p-2 border-none font-mono font-black text-blue-600 c-g bg-transparent" value="${g}"></td>
                <td class="text-center"><button onclick="this.closest('tr').remove()" class="text-red-300 hover:text-red-500 font-bold text-lg">✕</button></td>
            </tr>`;
        }

        function renderDvRow(n="", p="") {
            return `<div class="flex gap-2 p-3 bg-white rounded-2xl border border-slate-100 shadow-sm">
                <input class="flex-1 bg-transparent border-none text-xs font-bold dv-n" value="${n}" placeholder="Tên dịch vụ">
                <input class="w-24 bg-transparent border-none text-xs font-mono font-black text-green-600 dv-p text-right" value="${p}" placeholder="Giá">
                <button onclick="this.parentElement.remove()" class="px-2 text-red-200 hover:text-red-400">✕</button>
            </div>`;
        }

        function addDichVu() { document.getElementById("dv-list").insertAdjacentHTML('beforeend', renderDvRow()); }

        // --- LOGIC TỰ ĐỘNG ĐÁNH SỐ THÔNG MINH ---
        function appendCourts() {
            const count = parseInt(document.getElementById("m-count").value);
            const type = document.getElementById("m-type").value;
            if (!count) return;

            const list = document.getElementById("court-list");
            
            // Tìm số sân cao nhất hiện có của loại hình đang chọn
            let maxInType = 0;
            const currentRows = list.querySelectorAll("tr");
            currentRows.forEach(row => {
                const rowType = row.querySelector(".c-l").innerText;
                const rowName = row.querySelector(".c-t").value;
                if (rowType === type) {
                    // Trích xuất số từ chuỗi "Sân X [CL]" hoặc "Sân X"
                    const match = rowName.match(/\d+/);
                    if (match) {
                        const num = parseInt(match[0]);
                        if (num > maxInType) maxInType = num;
                    }
                }
            });

            // Thêm sân mới bắt đầu từ maxInType + 1
            for (let i = 1; i <= count; i++) {
                const nextNum = maxInType + i;
                const typeLabel = type === 'Cầu lông' ? 'CL' : 'PB';
                const courtName = `Sân ${nextNum} [${typeLabel}]`;
                const sttTotal = list.querySelectorAll("tr").length + 1;
                list.insertAdjacentHTML('beforeend', renderRow(sttTotal, courtName, type, 100000));
            }
            document.getElementById("m-count").value = "";
        }

        async function saveAll() {
            showLoading(true);
            const ds = []; document.querySelectorAll("#court-list tr").forEach(tr => ds.push({ t: tr.querySelector(".c-t").value, l: tr.querySelector(".c-l").innerText, g: tr.querySelector(".c-g").value }));
            const dv = []; document.querySelectorAll("#dv-list > div").forEach(div => dv.push({ n: div.querySelector(".dv-n").value, p: div.querySelector(".dv-p").value }));
            await db.collection("courts").doc(auth.currentUser.uid).set({
                ten: document.getElementById("m-ten").value, dc: document.getElementById("m-dc").value,
                ds: ds, dv: dv
            });
            showLoading(false);
            alert("Đã cập nhật danh sách sân thành công!");
        }

        // --- 2. TAB LỊCH ĐẶT ---
        async function renderBookingGrid() {
            showLoading(true);
            const doc = await db.collection("courts").doc(auth.currentUser.uid).get();
            if (!doc.exists) { showLoading(false); return; }
            const data = doc.data();
            const selectedDate = window.currentDate || new Date().toISOString().split('T')[0];

            document.getElementById("main-content").innerHTML = `
                <div class="card p-5 space-y-4">
                    <div class="flex justify-between items-center bg-slate-50 p-3 rounded-2xl">
                        <div class="flex flex-col"><h2 class="sport-font text-blue-600 text-sm">Lịch đặt chi tiết</h2><p class="text-[10px] text-slate-400 font-bold uppercase">${data.ten}</p></div>
                        <input type="date" id="date-select" value="${selectedDate}" onchange="changeDate(this.value)" class="bg-white border p-2 rounded-xl text-[10px] font-black text-slate-800 shadow-sm outline-none">
                    </div>

                    <div class="flex gap-2 overflow-x-auto pb-2 no-scrollbar">${generateQuickDates(selectedDate)}</div>

                    <div class="overflow-x-auto rounded-3xl border border-slate-200">
                        <div class="grid-container" style="--num-courts: ${data.ds.length}">
                            <div class="grid-cell header-cell">GIỜ</div>
                            ${data.ds.map((s) => {
                                const typeColor = s.l === 'Cầu lông' ? 'border-green-500' : 'border-blue-500';
                                return `<div class="grid-cell header-cell flex flex-col border-b-4 ${typeColor}">
                                    <span class="text-[10px] leading-tight">${s.t}</span>
                                    <span class="text-[8px] opacity-60 font-mono">${(s.g/1000)}k/h</span>
                                </div>`;
                            }).join('')}
                            ${generateGridRows(data.ds)}
                        </div>
                    </div>
                </div>`;
            await loadBookingStatus(selectedDate);
            showLoading(false);
        }

        function generateQuickDates(selected) {
            let h = "";
            for (let i = 0; i < 7; i++) {
                let d = new Date(); d.setDate(d.getDate() + i);
                let iso = d.toISOString().split('T')[0];
                let active = iso === selected;
                h += `<button onclick="changeDate('${iso}')" class="flex-shrink-0 w-12 h-16 flex flex-col items-center justify-center rounded-2xl border transition-all ${active ? 'bg-blue-600 text-white border-blue-600 shadow-lg scale-105' : 'bg-white text-slate-400 border-slate-100'}">
                    <span class="text-[9px] font-bold uppercase">${['CN','T2','T3','T4','T5','T6','T7'][d.getDay()]}</span>
                    <span class="text-sm font-black">${d.getDate()}</span>
                </button>`;
            }
            return h;
        }

        function generateGridRows(courts) {
            let h = "";
            for (let i = 5; i <= 23; i++) {
                [":00", ":30"].forEach(m => {
                    let t = i.toString().padStart(2, '0') + m;
                    h += `<div class="grid-cell cell-time">${t}</div>`;
                    courts.forEach((s, idx) => {
                        h += `<div onclick="toggleCell(this)" class="grid-cell status-empty" 
                              data-slot="slot_${t.replace(':','')}_${idx}" 
                              data-price="${s.g/2}" data-time="${t}">
                            <span class="text-[7px] opacity-20 font-bold uppercase tracking-tighter">Trống</span>
                        </div>`;
                    });
                });
            }
            return h;
        }

        function toggleCell(el) {
            if (el.classList.contains('status-booked')) return;
            el.classList.toggle("is-selecting");
            const sel = document.querySelectorAll(".is-selecting");
            const panel = document.getElementById("lock-panel");
            if (sel.length > 0) {
                panel.classList.remove("hidden");
                let m = 0; sel.forEach(c => m += parseFloat(c.dataset.price));
                document.getElementById("txt-duration").innerText = (sel.length * 0.5) + " GIỜ";
                document.getElementById("txt-money").innerText = m.toLocaleString() + " VNĐ";
            } else { panel.classList.add("hidden"); }
        }

        async function changeDate(d) { window.currentDate = d; await renderBookingGrid(); }

        async function loadBookingStatus(date) {
            const snap = await db.collection("bookings").doc(`${auth.currentUser.uid}_${date}`).get();
            if (!snap.exists) return;
            const data = snap.data();
            Object.keys(data).forEach(key => {
                const cell = document.querySelector(`[data-slot="${key}"]`);
                if (cell) {
                    const s = data[key].s;
                    if (s === 'locked') { cell.className = "grid-cell status-manual-locked"; cell.innerHTML = "<span class='text-[9px]'>KHÁCH NGOÀI</span>"; }
                    else if (s === 'booked') { cell.className = "grid-cell status-booked"; cell.innerHTML = "<span>ĐÃ ĐẶT</span>"; }
                    else if (s === 'empty') { cell.className = "grid-cell status-empty"; cell.innerHTML = "<span class='text-[7px] opacity-20 font-bold uppercase'>Trống</span>"; }
                }
            });
        }

        async function actionLock(type) {
            showLoading(true);
            const sel = document.querySelectorAll(".is-selecting");
            const date = window.currentDate || new Date().toISOString().split('T')[0];
            const updates = {};
            sel.forEach(el => { updates[el.dataset.slot] = { s: type, p: type === 'locked' ? el.dataset.price : 0 }; });
            await db.collection("bookings").doc(`${auth.currentUser.uid}_${date}`).set(updates, { merge: true });
            document.getElementById("lock-panel").classList.add("hidden");
            await renderBookingGrid();
            showLoading(false);
        }
    </script>
</body>
</html>
