<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>RankSport v28 – Hệ sinh thái thể thao số</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body { font-family: system-ui; background:#f8fafc }
.cell { border:1px solid #e5e7eb; height:64px; cursor:pointer }
.cl { background:#dcfce7; border-left:5px solid #22c55e }
.pb { background:#dbeafe; border-left:5px solid #3b82f6 }
.pending { background:#fef3c7; border-left:5px solid #f59e0b }
.sel { background:#2563eb; color:white }
</style>
</head>

<body class="pb-24">

<!-- HEADER -->
<header id="header" class="hidden flex justify-between items-center p-4 bg-white border-b sticky top-0 z-50">
  <div class="flex items-center gap-3">
    <div class="text-2xl font-black italic">RankSport</div>
    <div class="text-xs text-blue-500 uppercase tracking-widest">Hệ sinh thái thể thao số</div>
  </div>
  <button onclick="logout()" class="text-xs font-bold text-red-500">Thoát</button>
</header>

<main id="app"></main>

<nav id="nav" class="hidden fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around p-3"></nav>

<script>
/* ================= FIREBASE ================= */
firebase.initializeApp({
 apiKey:"AIzaSyBpytj0KQybf55iabBzmeg59VL-9oADPHA",
 authDomain:"badrank-89mrd.firebaseapp.com",
 projectId:"badrank-89mrd"
});
const db = firebase.firestore();
const auth = firebase.auth();

/* ================= GLOBAL STATE ================= */
let ROLE = null;
let OWNER_ID = null;
let ACTIVE_DATE = new Date().toISOString().split("T")[0];
let SELECTED = [];

/* ================= AUTH ================= */
auth.onAuthStateChanged(u=>{
  if(!u){ renderLogin(); return; }
  document.getElementById("header").classList.remove("hidden");
  renderRole();
});

/* ================= UI ================= */
function renderLogin(){
  app.innerHTML=`
  <div class="h-screen flex flex-col items-center justify-center">
    <div class="text-4xl font-black italic">RankSport</div>
    <p class="text-xs text-blue-500 tracking-widest mb-10">HỆ SINH THÁI THỂ THAO SỐ</p>
    <button onclick="auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())"
      class="bg-slate-900 text-white px-8 py-4 rounded-xl font-black">ĐĂNG NHẬP</button>
  </div>`;
}

function renderRole(){
  app.innerHTML=`
  <div class="p-10 grid md:grid-cols-2 gap-8">
    <button onclick="init('owner')" class="p-10 bg-white border rounded-3xl">
      🏟️ <div class="font-black mt-4">CHỦ SÂN</div>
    </button>
    <button onclick="init('vdv')" class="p-10 bg-slate-900 text-white rounded-3xl">
      👟 <div class="font-black mt-4">VẬN ĐỘNG VIÊN</div>
    </button>
  </div>`;
}

/* ================= INIT ================= */
function init(r){
 ROLE=r;
 nav.classList.remove("hidden");
 if(r==="owner"){
   OWNER_ID=auth.currentUser.uid;
   nav.innerHTML=`
    <button onclick="renderOwnerConfig()">⚙️ Cấu hình</button>
    <button onclick="renderOwnerSchedule()">📅 Lịch</button>
    <button onclick="renderRevenue()">💰 Doanh thu</button>`;
   renderOwnerConfig();
 } else {
   nav.innerHTML=`
    <button onclick="renderArena()">⚔️ Sàn đấu</button>
    <button onclick="renderProfile()">👤 Hồ sơ</button>`;
   renderArena();
 }
}

/* ================= OWNER CONFIG ================= */
async function renderOwnerConfig(){
 const doc = await db.collection("courts").doc(OWNER_ID).get();
 const d = doc.exists?doc.data():{courts:[],services:[],fixedCost:0};
 app.innerHTML=`
 <div class="p-8 space-y-6">
  <h2 class="font-black text-xl">Cấu hình sân</h2>

  <div class="bg-white p-6 rounded-xl">
   <h3 class="font-bold mb-2">Danh sách sân</h3>
   <div id="courtList">
     ${d.courts.map(c=>`
       <div class="flex gap-2 mb-2">
         <input value="${c.name}" disabled class="flex-1 bg-slate-100 p-2 rounded">
         <span class="text-xs">${c.type}</span>
         <span>${fmt(c.price)}đ</span>
       </div>`).join("")}
   </div>
   <button onclick="addCourt()" class="mt-4 bg-blue-600 text-white px-4 py-2 rounded">Thêm sân</button>
  </div>

  <div class="bg-white p-6 rounded-xl">
    <h3 class="font-bold">Chi phí cố định / tháng</h3>
    <input id="fixedCost" value="${d.fixedCost||0}" class="mt-2 bg-slate-100 p-2 rounded w-full">
  </div>

  <button onclick="saveConfig()" class="bg-slate-900 text-white px-8 py-4 rounded-xl font-black">
    LƯU CẤU HÌNH
  </button>
 </div>`;
}

/* ================= OWNER SCHEDULE ================= */
async function renderOwnerSchedule(){
 const doc = await db.collection("courts").doc(OWNER_ID).get();
 if(!doc.exists){ alert("Chưa cấu hình sân"); return; }
 const courts = doc.data().courts;
 app.innerHTML=`
 <div class="p-6">
  <input type="date" value="${ACTIVE_DATE}" onchange="ACTIVE_DATE=this.value;renderOwnerSchedule()">
  <div class="overflow-x-auto mt-4">
   <table class="min-w-full text-xs">
    <tr>
     <th>Giờ</th>
     ${courts.map(c=>`<th>${c.name}<br>${c.type}</th>`).join("")}
    </tr>
    ${genRows(courts,true)}
   </table>
  </div>
 </div>`;
 loadBookings(true);
}

/* ================= VDV ================= */
async function renderArena(){
 const snap = await db.collection("courts").get();
 app.innerHTML=`<div class="p-6 grid md:grid-cols-3 gap-6">
 ${snap.docs.map(d=>`
  <div onclick="openCourt('${d.id}')" class="bg-white p-6 rounded-xl border cursor-pointer">
   <div class="font-black">${d.data().name||"Cụm sân"}</div>
   <div class="text-xs text-slate-400">${d.data().courts.length} sân</div>
  </div>`).join("")}
 </div>`;
}

async function openCourt(id){
 OWNER_ID=id;
 const doc = await db.collection("courts").doc(id).get();
 const courts=doc.data().courts;
 app.innerHTML=`
 <div class="p-6">
  <input type="date" value="${ACTIVE_DATE}" onchange="ACTIVE_DATE=this.value;openCourt('${id}')">
  <table class="min-w-full text-xs mt-4">
   <tr>
    <th>Giờ</th>
    ${courts.map(c=>`<th>${c.name}</th>`).join("")}
   </tr>
   ${genRows(courts,false)}
  </table>
 </div>`;
 loadBookings(false);
}

/* ================= CORE LOGIC ================= */
function genRows(courts,isOwner){
 let h="";
 for(let i=6;i<22;i++){
  ["00","30"].forEach(m=>{
   const t=`${i}:${m}`;
   h+=`<tr><td>${t}</td>`;
   courts.forEach(c=>{
    h+=`<td class="cell" data-slot="${c.id}_${t}" 
      onclick="${isOwner?'':'selectSlot(this)'}"></td>`;
   });
   h+="</tr>";
  });
 }
 return h;
}

function selectSlot(el){
 if(el.classList.contains("cl")||el.classList.contains("pb")) return;
 el.classList.toggle("sel");
 if(el.classList.contains("sel")) SELECTED.push(el.dataset.slot);
 else SELECTED=SELECTED.filter(s=>s!==el.dataset.slot);
}

async function loadBookings(isOwner){
 const snap = await db.collection("bookings")
  .where("owner","==",OWNER_ID)
  .where("date","==",ACTIVE_DATE).get();
 snap.forEach(d=>{
  const b=d.data();
  b.slots.forEach(s=>{
   const el=document.querySelector(`[data-slot="${s}"]`);
   if(!el) return;
   el.className="cell "+(b.type==="PB"?"pb":"cl");
   if(isOwner && b.status==="pending") el.classList.add("pending");
  });
 });
}

/* ================= REVENUE ================= */
async function renderRevenue(){
 const snap = await db.collection("bookings")
  .where("owner","==",OWNER_ID).get();
 let cl=0,pb=0;
 snap.forEach(d=>{
  if(d.data().status!=="locked") return;
  d.data().type==="PB"?pb+=d.data().total:cl+=d.data().total;
 });
 app.innerHTML=`
 <div class="p-10 grid md:grid-cols-3 gap-6">
  <div class="bg-green-100 p-6 rounded-xl">CL: ${fmt(cl)}đ</div>
  <div class="bg-blue-100 p-6 rounded-xl">PB: ${fmt(pb)}đ</div>
  <div class="bg-slate-900 text-white p-6 rounded-xl">
   Thực thu: ${fmt(cl+pb)}đ
  </div>
 </div>`;
}

/* ================= UTILS ================= */
function addCourt(){
 const name=prompt("Tên sân?");
 const type=prompt("CL hay PB?");
 const price=parseInt(prompt("Giá/giờ"));
 if(!name||!type||!price) return;
 db.collection("courts").doc(OWNER_ID).set({
  courts:firebase.firestore.FieldValue.arrayUnion({
    id:crypto.randomUUID(),
    name,type,price
  })
 },{merge:true}).then(renderOwnerConfig);
}

function saveConfig(){
 db.collection("courts").doc(OWNER_ID).set({
  fixedCost:parseInt(document.getElementById("fixedCost").value)||0
 },{merge:true}).then(()=>alert("Đã lưu"));
}

function renderProfile(){
 app.innerHTML=`<div class="p-10 text-center font-black text-3xl">
 ${auth.currentUser.displayName}
 </div>`;
}

function logout(){ auth.signOut(); location.reload(); }
function fmt(v){ return new Intl.NumberFormat("vi-VN").format(v||0); }
</script>
</body>
</html>
